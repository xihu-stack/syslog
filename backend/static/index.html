<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>用户行为分析系统</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="https://cdn.bootcdn.net/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link rel="stylesheet" href="https://cdn.bootcdn.net/ajax/libs/animate.css/4.1.1/animate.min.css">
<script src="/libs/react.js"></script>
<script src="/libs/react-dom.js"></script>
<script src="/libs/dayjs.js"></script>
<script src="/libs/antd.js"></script>
<script src="/libs/echarts.js"></script>
<script src="/libs/babel.js"></script>
<style>
  :root{
    /* 中性色 slate */
    --ink:#0f172a; --ink2:#475569; --ink3:#94a3b8; --ink4:#e2e8f0;
    --line:#eef2f7; --bg:#f6f8fb; --surface:#ffffff;
    /* 品牌靛紫 */
    --brand:#6366f1; --brand-soft:#eef2ff; --brand-deep:#4f46e5;
    /* 语义 */
    --danger:#ef4444; --danger-soft:#fef2f2;
    --warn:#f59e0b; --warn-soft:#fffbeb;
    --orange:#f97316; --orange-soft:#fff7ed;
    --ok:#22c55e; --ok-soft:#f0fdf4;
    /* 字号 token(5档:数字大/KPI/标题/正文/辅助/微) */
    --fs-xl:30px; --fs-lg:16px; --fs-md:13px; --fs-sm:12px; --fs-xs:11px;
    /* 圆角(更圆润) */
    --r:18px; --r-md:14px; --r-sm:10px;
    /* 阴影 */
    --sh-xs:0 1px 2px rgba(15,23,42,.04);
    --sh-sm:0 1px 3px rgba(15,23,42,.04),0 1px 2px rgba(15,23,42,.03);
    --sh-md:0 6px 16px rgba(15,23,42,.07),0 2px 4px rgba(15,23,42,.04);
    --sh-lg:0 16px 40px rgba(15,23,42,.12),0 4px 8px rgba(15,23,42,.05);
    /* 毛玻璃 */
    --glass:rgba(255,255,255,.72);
    --glass-blur:saturate(180%) blur(20px);
    /* 深色侧栏(Linear 风) */
    --sb-bg:#0b0f1a; --sb-bg2:#111726;
    --sb-fg:#94a3b8; --sb-fg-active:#fff; --sb-hover:rgba(255,255,255,.05);
    --sb-border:rgba(255,255,255,.06);
    /* 数字字体 */
    --mono:"SF Mono","JetBrains Mono","Roboto Mono",Consolas,"Liberation Mono",Menlo,monospace;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","HarmonyOS Sans","Microsoft YaHei",sans-serif;-webkit-font-smoothing:antialiased;font-size:var(--fs-md);}
  #root{min-height:100vh;}
  /* 数字:等宽字体 + tabular */
  .num{font-variant-numeric:tabular-nums;letter-spacing:-.3px;font-feature-settings:"tnum";font-family:var(--mono);}
  /* 用户名统一样式(全站一致:黑色、加粗、可点击但不显蓝色链接) */
  .uname{color:var(--ink) !important;font-weight:600;cursor:pointer;}
  .uname:hover{color:var(--brand) !important;}
  /* ===== 深色侧栏(Linear 风)===== */
  .ant-layout-sider{background:var(--sb-bg) !important;box-shadow:none !important;}
  .logo{height:60px;display:flex;align-items:center;gap:10px;padding:0 18px;color:#fff;font-size:14px;font-weight:600;letter-spacing:.2px;background:linear-gradient(180deg,var(--sb-bg2),var(--sb-bg));border-bottom:1px solid var(--sb-border);}
  .logo .ic{width:30px;height:30px;border-radius:8px;background:linear-gradient(135deg,#6366f1,#8b5cf6);display:flex;align-items:center;justify-content:center;font-size:14px;color:#fff;flex-shrink:0;box-shadow:0 2px 8px rgba(99,102,241,.4);}
  .logo .tx{display:flex;flex-direction:column;line-height:1.2;}
  .logo .tx b{font-size:13px;color:#fff;font-weight:600;}
  .logo .tx s{font-size:10px;color:var(--sb-fg);text-decoration:none;letter-spacing:.5px;margin-top:1px;}
  /* 菜单分组标签 */
  .sb-group{color:#64748b;font-size:10px;font-weight:600;letter-spacing:1.5px;text-transform:uppercase;padding:14px 22px 6px;}
  /* 菜单底部状态 */
  .sb-foot{padding:12px 18px;border-top:1px solid var(--sb-border);margin-top:auto;}
  .sb-status{display:flex;align-items:center;gap:7px;font-size:11px;color:var(--sb-fg);}
  .sb-dot{width:7px;height:7px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 3px rgba(34,197,94,.15);}
  /* ===== KPI tile ===== */
  .tile{position:relative;background:var(--glass);backdrop-filter:var(--glass-blur);-webkit-backdrop-filter:var(--glass-blur);border-radius:var(--r);padding:20px 22px;cursor:pointer;transition:all .25s cubic-bezier(.4,0,.2,1);overflow:hidden;box-shadow:var(--sh-sm);}
  .tile:hover{box-shadow:var(--sh-md);transform:translateY(-2px);}
  .tile::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--brand);border-radius:0 2px 2px 0;opacity:0;transition:opacity .25s;}
  .tile:hover::before{opacity:1;}
  .tile .ic{position:absolute;right:18px;top:18px;width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:15px;background:var(--brand-soft);color:var(--brand);}
  .tile .v{font-size:var(--fs-xl);font-weight:700;color:var(--ink);letter-spacing:-.6px;line-height:1;}
  .tile.alert .v{color:var(--danger);}
  .tile.alert::before{background:var(--danger);opacity:1;}
  .tile.alert .ic{background:var(--danger-soft);color:var(--danger);}
  .tile .l{color:var(--ink2);font-size:var(--fs-sm);margin-top:10px;letter-spacing:.2px;font-weight:500;}
  .tile .sub{color:var(--ink3);font-size:var(--fs-xs);margin-top:3px;font-weight:400;}
  .tile .arr{position:absolute;right:16px;bottom:14px;color:var(--ink3);font-size:var(--fs-xs);opacity:0;transition:opacity .2s;}
  .tile:hover .arr{opacity:.7;}
  /* ===== 漏斗卡(用户视图) ===== */
  .uc-card{background:var(--surface);border-top:3px solid var(--ink4);border-radius:var(--r);padding:18px 20px;cursor:pointer;transition:all .25s cubic-bezier(.4,0,.2,1);box-shadow:var(--sh-sm);position:relative;}
  .uc-card:hover{box-shadow:var(--sh-md);transform:translateY(-2px);}
  .uc-v{font-size:26px;font-weight:700;line-height:1;letter-spacing:-.5px;font-variant-numeric:tabular-nums;}
  .uc-l{color:var(--ink2);font-size:var(--fs-sm);margin-top:8px;letter-spacing:.2px;font-weight:500;}
  .uc-sub{color:var(--ink3);font-size:var(--fs-xs);margin-left:6px;font-weight:400;}
  /* ===== 徽章/标签 ===== */
  .risk{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:var(--r-sm);font-weight:700;font-size:var(--fs-sm);letter-spacing:.2px;line-height:1.4;}
  .st-tag{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:var(--r-sm);font-size:var(--fs-xs);font-weight:600;letter-spacing:.2px;line-height:1.4;}
  .legend{display:flex;gap:18px;align-items:center;}
  .legend span{display:inline-flex;align-items:center;font-size:var(--fs-sm);color:var(--ink2);}
  .swatch{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:6px;}
  /* ===== 卡片(毛玻璃 + 圆润)===== */
  .card{border:none !important;border-radius:var(--r) !important;box-shadow:var(--sh-sm) !important;animation:cardIn .35s cubic-bezier(.4,0,.2,1) both;transition:box-shadow .25s,transform .25s !important;background:var(--glass) !important;backdrop-filter:var(--glass-blur);-webkit-backdrop-filter:var(--glass-blur);}
  .card:hover{box-shadow:var(--sh-md) !important;}
  @keyframes cardIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  @keyframes sk{0%{background-position:100% 50%}100%{background-position:0 50%}}
  .card>.ant-card-head{min-height:44px !important;border-bottom-color:var(--line) !important;padding:0 18px !important;}
  .card>.ant-card-head .ant-card-head-title{font-size:var(--fs-md);font-weight:600;color:var(--ink);letter-spacing:.2px;}
  .card>.ant-card-body{padding:14px 18px !important;}
  .sec-title{color:var(--ink2);font-size:var(--fs-sm);letter-spacing:.3px;margin:8px 2px 14px;font-weight:500;}
  .sec-fade{color:var(--ink3);}
  .brand-bar{display:inline-block;width:3px;height:15px;background:var(--brand);border-radius:2px;vertical-align:-2px;margin-right:9px;}
  /* ===== 大屏流程条 ===== */
  .flowbar{display:flex;align-items:stretch;background:var(--surface);border-radius:var(--r);padding:18px 20px;margin-bottom:18px;box-shadow:var(--sh-sm);}
  .flow-item{flex:1;min-width:90px;text-align:center;padding:4px 8px;cursor:pointer;transition:transform .2s;border-radius:var(--r-md);}
  .flow-item:hover{background:var(--brand-soft);}
  .flow-item:hover .fv{color:var(--brand);}
  .flow-item .fv{font-size:25px;font-weight:700;color:var(--ink);letter-spacing:-.5px;line-height:1;font-variant-numeric:tabular-nums;}
  .flow-item .fl{font-size:var(--fs-xs);color:var(--ink3);margin-top:8px;letter-spacing:.4px;font-weight:500;}
  .flow-arrow{color:var(--ink4);font-size:12px;display:flex;align-items:center;}
  .flow-tail{margin-left:auto;padding-left:20px;display:flex;align-items:center;font-size:var(--fs-sm);color:var(--ink3);white-space:nowrap;}
  /* ===== 画像时间线 ===== */
  .tl{border-left:2px solid var(--ink4);margin:6px 0 6px 4px;padding-left:18px;}
  .tl .it{margin:12px 0;font-size:var(--fs-md);color:var(--ink2);position:relative;}
  .tl .it::before{content:"";position:absolute;left:-24px;top:6px;width:10px;height:10px;border-radius:50%;background:var(--surface);border:2px solid var(--brand);}
  .tl .t{color:var(--ink3);font-size:var(--fs-xs);margin-top:3px;letter-spacing:.2px;}
  /* ===== 表格 ===== */
  .ant-table{border-radius:var(--r-md);overflow:hidden;}
  .ant-table-small>.ant-table-content .ant-table-tbody>tr>td,.ant-table-small>.ant-table-content .ant-table-thead>tr>th{padding:11px 10px !important;}
  .ant-table-thead>tr>th{background:var(--bg) !important;font-weight:600 !important;color:var(--ink2) !important;font-size:var(--fs-sm) !important;letter-spacing:.2px;border-bottom:1px solid var(--line) !important;}
  .ant-table-tbody>tr>td{border-bottom:1px solid var(--line) !important;}
  .ant-table-tbody>tr{transition:background .15s;}
  .ant-table-tbody>tr:hover>td{background:#f1f5f9 !important;}
  .ant-table-tbody>tr:last-child>td{border-bottom:none !important;}
  .row-crit{box-shadow:inset 4px 0 0 var(--danger);background:var(--danger-soft) !important;}
  .row-high{box-shadow:inset 4px 0 0 var(--orange);background:var(--orange-soft) !important;}
  .row-watch{box-shadow:inset 4px 0 0 var(--warn);}
  /* 用户视图行:只左侧细色条标示风险档,无背景色(保持表格干净) */
  .uv-crit{box-shadow:inset 3px 0 0 var(--danger);}
  .uv-high{box-shadow:inset 3px 0 0 var(--orange);}
  .uv-watch{box-shadow:inset 3px 0 0 #3b82f6;}
  /* ===== AntD 深度定制 ===== */
  .ant-statistic-content-value{color:var(--ink);font-weight:700 !important;letter-spacing:-.3px;font-family:var(--mono);font-variant-numeric:tabular-nums;}
  .ant-statistic-title{color:var(--ink2) !important;font-size:var(--fs-sm) !important;margin-bottom:4px !important;}
  /* 深色侧栏菜单 */
  .ant-menu-dark,.ant-menu{background:transparent !important;color:var(--sb-fg) !important;}
  .ant-menu-item-group-title{padding:0 !important;font-size:0 !important;line-height:0 !important;}
  .sb-group{display:inline-block;color:#64748b !important;font-size:10px !important;font-weight:600 !important;letter-spacing:1.5px;text-transform:uppercase;padding:14px 0 6px !important;}
  .ant-menu-item{font-size:var(--fs-md) !important;border-radius:var(--r-sm) !important;margin:2px 10px !important;width:calc(100% - 20px) !important;height:36px !important;line-height:36px !important;font-weight:500;color:var(--sb-fg) !important;display:flex !important;align-items:center;}
  .ant-menu-item>span>.fa-solid:first-child{margin-right:11px !important;width:15px;text-align:center;font-size:13px !important;opacity:.85;}
  .ant-menu-item:hover{color:#fff !important;background:var(--sb-hover) !important;}
  .ant-menu-item:hover .fa-solid{opacity:1 !important;}
  .ant-menu-item-selected{background:rgba(99,102,241,.18) !important;color:#fff !important;font-weight:600;box-shadow:inset 2px 0 0 var(--brand);}
  .ant-menu-item-selected .fa-solid{opacity:1;color:#a5b4fc !important;}
  .ant-menu-item-selected::after{display:none;}
  .ant-menu-item span span{flex:1;}
  .ant-btn{font-weight:500;border-radius:var(--r-sm) !important;height:32px;}
  .ant-btn-primary{background:var(--brand) !important;border-color:var(--brand) !important;box-shadow:0 2px 6px rgba(99,102,241,.25);}
  .ant-btn-primary:hover{background:var(--brand-deep) !important;border-color:var(--brand-deep) !important;}
  .ant-tag{font-size:var(--fs-xs);border-radius:var(--r-sm);padding:1px 8px;line-height:1.5;font-weight:500;}
  .ant-segmented{background:var(--bg) !important;border-radius:var(--r-md) !important;padding:2px;}
  .ant-segmented-item{border-radius:var(--r-sm) !important;font-size:var(--fs-sm) !important;font-weight:500;}
  .ant-segmented-item-selected{background:var(--surface) !important;box-shadow:var(--sh-xs);}
  .ant-tooltip-inner{font-size:var(--fs-sm);border-radius:var(--r-sm);}
  .ant-input,.ant-select-selector{border-radius:var(--r-sm) !important;}
  .ant-card-head-wrapper{align-items:center !important;}
  .ant-pagination-item,.ant-pagination-prev,.ant-pagination-next{border-radius:var(--r-sm) !important;}
  .ant-empty-description{color:var(--ink3);font-size:var(--fs-sm);}
  /* 进度条(效率榜摸鱼占比) */
  .pbar{width:56px;height:5px;background:var(--ink4);border-radius:3px;overflow:hidden;}
  .pbar>i{display:block;height:100%;border-radius:3px;}
  /* 链接 */
  a{color:var(--brand);}
  a:hover{color:var(--brand-deep);}
  /* 滚动条 */
  ::-webkit-scrollbar{width:8px;height:8px;}
  ::-webkit-scrollbar-thumb{background:var(--ink4);border-radius:4px;}
  ::-webkit-scrollbar-thumb:hover{background:var(--ink3);}
  ::-webkit-scrollbar-track{background:transparent;}
</style>
</head>
<body>
<div id="root"><div style="padding:40px;text-align:center;color:var(--ink3)">加载中（本地库，约1~2秒）…</div></div>
<script>window.onerror=function(m,s,l,c,e){var d=document.getElementById('root');if(d)d.innerHTML='<div style="padding:30px;color:#c0392b;font-family:monospace;white-space:pre-wrap">前端出错：'+(e&&e.stack||m)+'\n\n请截图发我。</div>';return false;};</script>
<script type="text/babel">
const { Layout, Menu, Card, Row, Col, Table, Tag, Button, Input, Form, message, Select, Modal,
        Space, Upload, Divider, Typography, Badge, Empty, Descriptions, Alert, Radio, ConfigProvider, Statistic, Segmented, Tooltip, Progress, Tabs, DatePicker } = antd;
const { Sider, Header, Content } = Layout;
const { useState, useEffect, useRef } = React;

const LVL = s => (s==null)?{c:'#94a3b8',l:'-'} : s>=86?{c:'#ef4444',l:'严重'} : s>=61?{c:'#f97316',l:'高危'} : s>=31?{c:'#3b82f6',l:'关注'} : {c:'#22c55e',l:'正常'};
const INTENT = {data_exfiltration:'数据外发', job_seeking:'求职离职', baseline_deviation:'行为偏离', policy_violation:'违规', normal_work:'正常', unknown:'未知'};
const DEV = {none:'无', minor:'轻微', major:'重大', severe:'严重', unknown:'未知'};
const STATUS_MAP = {NEW:{c:'#6366f1',t:'待处理',i:'fa-clock'}, TRIAGING:{c:'#f59e0b',t:'处理中',i:'fa-spinner'}, CONFIRMED:{c:'#ef4444',t:'已确认',i:'fa-circle-exclamation'}, FP:{c:'#94a3b8',t:'误报',i:'fa-xmark'}, CLOSED:{c:'#22c55e',t:'已关闭',i:'fa-circle-check'}};
// 防抖回调（延迟ms后执行，取消前序）
function debounce(fn, delay){ let t; return (...args) => { clearTimeout(t); t = setTimeout(()=>fn(...args), delay); }; }
const STATUS_OPTS = [{label:'待处理',value:'NEW'},{label:'处理中',value:'TRIAGING'},{label:'已确认',value:'CONFIRMED'},{label:'误报',value:'FP'},{label:'已关闭',value:'CLOSED'}];
const fmt = s => (s||'').replace('T',' ').slice(0,16);
const GET = u=>fetch(u).then(r=>r.ok?r.json():r.text().then(t=>Promise.reject(new Error('HTTP '+r.status)))).catch(e=>{console.error('GET '+u,e);return {};});
const GETL = u=>fetch(u).then(r=>r.ok?r.json():r.text().then(t=>Promise.reject(new Error('HTTP '+r.status)))).then(d=>Array.isArray(d)?d:[]).catch(e=>{console.error('GETL '+u,e);return [];});
const POST=(u,o)=>fetch(u,{method:'POST',...o}).then(r=>r.ok?r.json():r.text().then(t=>Promise.reject(new Error('HTTP '+r.status)))).catch(e=>{console.error('POST '+u,e);message.error('请求失败');return {};});
const PUTJ=(u,b)=>fetch(u,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)}).then(r=>r.ok?r.json():r.text().then(t=>Promise.reject(new Error('HTTP '+r.status)))).catch(e=>{console.error('PUT '+u,e);message.error('保存失败');return {};});
const DEL=(u)=>fetch(u,{method:'DELETE'}).then(r=>r.ok?r.json():r.text().then(t=>Promise.reject(new Error('HTTP '+r.status)))).catch(e=>{console.error('DEL '+u,e);message.error('删除失败');return {};});

// 带说明的表头:鼠标悬停显示口径/单位说明,让每个数字可懂
function TH({t, tip}){ return tip ? <Tooltip title={tip}><span style={{cursor:'help',borderBottom:'1px dotted var(--ink3)'}}>{t} <i className="fa-solid fa-circle-info" style={{fontSize:10,color:'var(--ink3)',marginLeft:2}}/></span></Tooltip> : <span>{t}</span>; }
function RiskBadge({s}){ const v=LVL(s); return <span className="risk" style={{background:v.c+'1a',color:v.c,border:'1px solid '+v.c+'66'}}><i className="fa-solid fa-shield-halved" style={{marginRight:4,fontSize:11}}></i>{s==null?'-':s} {v.l}</span>; }
function StatusTag({s}){ const v=STATUS_MAP[s]||{c:'#999',t:s}; return <span className="st-tag" style={{background:v.c+'1a',color:v.c}}>{v.i&&<i className={'fa-solid '+v.i} style={{marginRight:4,fontSize:11}}></i>}{v.t}</span>; }
const FROM_TITLE={computers:'用户视图',alerts:'告警管理',verdicts:'研判记录',efficiency:'效率监控',dashboard:'监控大屏'};
function ProfilePage({user, goBack, from}){
  const [data,setData]=useState(null);
  const trendRef=useRef(), hoursRef=useRef(), actRef=useRef();
  useEffect(()=>{ if(user) GET('/api/employees/'+encodeURIComponent(user)).then(setData); },[user]);
  useEffect(()=>{
    if(!data) return;
    const vs=data.verdicts||[];
    if(vs.length&&trendRef.current){ const c=echarts.init(trendRef.current);
      const riskColors=vs.map(v=>v.risk_score>=86?'#ef4444':v.risk_score>=61?'#f97316':v.risk_score>=31?'#f59e0b':'#22c55e');
      c.setOption({tooltip:{trigger:'axis',formatter:p=>p[0].name+'<br/>风险分: <b>'+p[0].value+'</b>'},grid:{left:40,right:20,top:20,bottom:35},
        xAxis:{type:'category',data:vs.map(v=>(v.window_start||'').replace('T',' ').slice(5,16)),axisLabel:{color:'#94a3b8',fontSize:11,rotate:30}},
        yAxis:{type:'value',max:100,axisLabel:{color:'#94a3b8'},splitLine:{lineStyle:{color:'#f1f5f9'}}},
        series:[{type:'line',data:vs.map(v=>v.risk_score||0),smooth:true,areaStyle:{color:'rgba(99,102,241,.12)'},lineStyle:{color:'#6366f1'},itemStyle:{color:function(p){return riskColors[p.dataIndex]||'#6366f1';}}}]});}
    const hrs=(data.profile||{}).active_hours_top||[];
    if(hrs.length&&hoursRef.current){ const c=echarts.init(hoursRef.current);
      const full=Array.from({length:24},(_,h)=>hrs.includes(h)?1:0);
      c.setOption({tooltip:{},grid:{left:30,right:15,top:15,bottom:30},
        xAxis:{type:'category',data:Array.from({length:24},(_,h)=>h+'时'),axisLabel:{color:'#94a3b8',fontSize:11}},
        yAxis:{type:'value',show:false},
        series:[{type:'bar',data:full,itemStyle:{color:full.map(f=>f?'#6366f1':'#e2e8f0'),borderRadius:[3,3,0,0]}}]});}
    const evs=data.events||[];
    const hasDoc=(data.category_counts||{}).DOC;
    if(evs.length&&actRef.current&&hasDoc){ const c=echarts.init(actRef.current);
      const actCnt={}; evs.forEach(e=>{ const a=e.action||'UNKNOWN'; actCnt[a]=(actCnt[a]||0)+1; });
      const top=Object.entries(actCnt).sort((a,b)=>b[1]-a[1]).slice(0,8);
      c.setOption({tooltip:{},grid:{left:80,right:20,top:15,bottom:30},
        xAxis:{type:'value',axisLabel:{color:'#94a3b8'}},
        yAxis:{type:'category',data:top.map(t=>t[0]).reverse(),axisLabel:{color:'var(--ink2)',fontSize:11}},

        {domains.slice(0,40).map((d,i)=><Tag key={d} style={{fontSize:11}} color={i<5?'blue':'default'}>{d}</Tag>)}

    </Card>}
  </div>);
}

              {key:'computers',label:<span><i className="fa-solid fa-users"></i><span>用户视图</span></span>},

function Dashboard({go, goProfile}){

      c.setOption({tooltip:{trigger:'item'},legend:{bottom:0,textStyle:{color:'#475569',fontSize:11},icon:'circle',itemWidth:8,itemHeight:8},

      const top=Object.entries(er).sort((a,b)=>b[1]-a[1]).slice(0,5); if(!top.length){ bar.current.innerHTML='<div style="text-align:center;color:var(--ink3);padding-top:60px">暂无高风险用户</div>'; } else { const c=echarts.init(bar.current); barChart.current=c;
      c.setOption({tooltip:{trigger:'axis',axisPointer:{type:'shadow'},formatter:p=>p[0].name+'：'+p[0].value+'分'},grid:{left:200,right:60},xAxis:{type:'value',max:100,axisLine:{lineStyle:{color:'#e2e8f0'}},axisLabel:{color:'#94a3b8'},splitLine:{lineStyle:{color:'var(--bg)'}}},
        yAxis:{type:'category',data:top.map(x=>x[0]).reverse(),axisLabel:{color:'#475569',fontSize:13,interval:0},axisLine:{lineStyle:{color:'#e2e8f0'}}},
        series:[{type:'bar',data:top.map(x=>x[1]).reverse(),barCategoryGap:'30%',itemStyle:{color:'#6366f1',borderRadius:[0,6,6,0]},label:{show:true,position:'right',color:'var(--ink2)',formatter:'{c}分'}}]}); c.on('click',p=>goProfile&&goProfile(p.name));}} else { bar.current.innerHTML='<div style="text-align:center;color:var(--ink3);padding-top:60px">暂无高风险用户</div>'; }}
  },[vs, al]);

  },[sys]);
  const SRC={"sangfor":"深信服","ipguard":"IP-Guard","":"未知"};
  const ev=(sys.events||{}), vd=(sys.verdicts||{}), sysAl=(sys.alerts||{}), src=(sys.sources||{});
  const ago=ts=>{if(!ts)return '-';const d=Math.floor((Date.now()/1000-ts)/60);if(d<1)return '刚刚';if(d<60)return d+'分钟前';const h=Math.floor(d/60);return h<24?h+'小时前':Math.floor(h/24)+'天前';};

    {(()=>{

function Computers({goProfile,filter}){
  const isToday=filter&&filter.today; const tStr=new Date().toLocaleDateString('en-CA',{timeZone:'Asia/Shanghai'});
  const [rows,setRows]=useState(null); const [uq,setUq]=useState(''); const [riskFilter,setRiskFilter]=useState('all');
  const [lastUpd,setLastUpd]=useState(null); const [loading,setLoading]=useState(true); const [excs,setExcs]=useState([]);
  const load=async()=>{const [r,ex]=await Promise.all([GETL('/api/computers'),GET('/api/exceptions')]);setRows(r);setExcs(Array.isArray(ex)?ex:((ex&&ex.items)||[]));setLastUpd(new Date());setLoading(false);};
  useEffect(()=>{ load(); const t=setInterval(load,15000); return ()=>clearInterval(t); },[]);
  const exMap={}; excs.forEach(e=>{const k=e.employee; if(k){(exMap[k]=exMap[k]||[]).push(INTENT[e.signal_type]||e.signal_type);}});
  const base=(rows||[]).filter(r=>{
    if(isToday&&(r.last_seen||'').slice(0,10)!==tStr)return false;
    if(uq&&!(r.computer||'').toLowerCase().includes(uq.toLowerCase()))return false;
    return true;
  });
  // 风险分档(互斥): 正常0-30 / 关注31-60 / 高危61-85 / 严重86+。
  // 各档不重叠,数字相加=总数,符合直觉。旧版"关注以上/高危以上"是包含关系(62含41),误导。
  const CARDS=[
    {k:'all',   label:'用户总数', sub:'全部', value:base.length, color:'#6366f1', icon:'fa-users'},
    {k:'watch', label:'关注',     sub:'31-60', value:base.filter(r=>{const x=r.max_risk||0;return x>=31&&x<61;}).length, color:'#3b82f6', icon:'fa-eye'},
    {k:'high',  label:'高危',     sub:'61-85', value:base.filter(r=>{const x=r.max_risk||0;return x>=61&&x<86;}).length, color:'#f97316', icon:'fa-triangle-exclamation'},
    {k:'crit',  label:'严重',     sub:'86+',   value:base.filter(r=>(r.max_risk||0)>=86).length, color:'#ef4444', icon:'fa-circle-exclamation'},
  ];
  const filtered=base.filter(r=>{
    const x=r.max_risk||0;
    if(riskFilter==='watch'&&(x<31||x>=61))return false;   // 关注档 31-60
    if(riskFilter==='high'&&(x<61||x>=86))return false;     // 高危档 61-85
    if(riskFilter==='crit'&&x<86)return false;              // 严重档 86+
    if(riskFilter==='clean'&&(r.alert_count||0)>0)return false;
    return true;
  });
  const evtTotal=filtered.reduce((s,r)=>s+(isToday?(r.event_count_today||0):(r.event_count||0)),0);
  return (<div>
    <div className="sec-title">{isToday?'用户视图 · 仅今日活跃':'用户视图'} · 点击行查看画像 · <span style={{fontSize:11,color:'var(--ink3)'}}>每15秒刷新{lastUpd&&' · '+lastUpd.toLocaleTimeString()}</span></div>
    <Row gutter={16} style={{marginBottom:16}}>
      {CARDS.map(c=>{const active=riskFilter===c.k; return (
        <Col span={6} key={c.k}>
          <div className="uc-card" onClick={()=>setRiskFilter(active&&c.k!=='all'?'all':c.k)}
               style={{borderTopColor:active?c.color:'var(--ink4)',background:active?c.color+'0d':undefined,boxShadow:active?'0 0 0 2px '+c.color+'40':undefined}}>
            <div style={{display:'flex',alignItems:'center',justifyContent:'space-between'}}>
              <div>
                <div className="uc-v" style={{color:active?c.color:'var(--ink)'}}>{c.value}</div>
                <div className="uc-l">{c.label}{c.sub&&<span className="uc-sub">{c.sub}</span>}</div>
              </div>
              <i className={'fa-solid '+c.icon} style={{color:active?c.color:'var(--ink3)',opacity:active?.9:.3,fontSize:24}}></i>
            </div>
          </div>
        </Col>);})}
    </Row>
    <Card className="card" size="small">
      <Space style={{marginBottom:8}} wrap>
        {isToday&&<Tag color="blue">仅今日活跃用户</Tag>}
        <Input.Search placeholder="搜索用户名" allowClear style={{width:180}} onChange={e=>setUq(e.target.value)} />
        <Segmented value={riskFilter} onChange={setRiskFilter} size="small" options={[
          {label:'全部',value:'all'},{label:'关注31-60',value:'watch'},{label:'高危61-85',value:'high'},{label:'严重86+',value:'crit'},{label:'无告警',value:'clean'}]}/>
      </Space>
      <div style={{marginBottom:8,padding:'7px 12px',background:'var(--bg)',borderRadius:8,fontSize:12,color:'var(--ink2)',display:'flex',alignItems:'center',gap:8}}>
        {riskFilter!=='all' && <Tag color={riskFilter==='crit'?'red':riskFilter==='high'?'orange':riskFilter==='watch'?'blue':'default'} style={{marginRight:0}}>{riskFilter==='crit'?'严重86+':riskFilter==='high'?'高危61-85':riskFilter==='watch'?'关注31-60':riskFilter==='clean'?'无告警':''}</Tag>}
        <span>当前 <b className="num" style={{color:'var(--ink)',fontSize:14}}>{filtered.length}</b> / {base.length} 人{isToday?' (今日)':''} · {isToday?'今日':''}事件 <b className="num">{evtTotal}</b></span>
      </div>
      <Table size="small" rowKey="computer" pagination={{pageSize:14}} loading={loading}
        dataSource={filtered}
        onRow={r=>({onClick:()=>goProfile(r.computer),style:{cursor:'pointer'}})}
        columns={[
          {title:<TH t="用户" />,dataIndex:'computer',width:170,
            render:(v,r)=>{const rk=r.max_risk||0;const ex=exMap[v];return (<span><a className="uname">{v}</a>{ex&&<Tooltip title={'已豁免：'+ex.join('、')}><Tag color="default" style={{marginLeft:6,fontSize:11,lineHeight:'16px'}}>豁免</Tag></Tooltip>}</span>);}},
          {title:<TH t="风险" tip="该员工历史最高研判风险分(0-100)。86+严重/61+高危/31+关注/0-30正常。" />,dataIndex:'max_risk',width:95,render:v=><RiskBadge s={v}/>},
          {title:<TH t="告警" tip="合并后的告警条数(同员工同意图合并为1条,取最高分)。非研判次数。" />,dataIndex:'alert_count',width:64,render:v=>v>0?<Tag color="red">{v}条</Tag>:<span style={{color:'var(--ink4)'}}>—</span>},
          {title:<TH t={isToday?'今日事件':'事件'} tip="降噪聚合后的事件条数(同域名10分钟内合并),非原始上网次数。今日=北京时间当日0点起。" />,width:80,render:(_,r)=><span className="num" style={{color:'var(--ink2)'}}>{isToday?(r.event_count_today||0):(r.event_count||0)}</span>},
          {title:<TH t="最近活动" tip="该员工最后一次产生行为的时间。" />,dataIndex:'last_seen',width:130,render:fmt},
          {title:'',width:40,render:()=><span style={{color:'var(--ink4)',fontSize:11}}>▸</span>},
        ]}/>
    </Card>
  </div>);
}

function Alerts({goProfile,filter}){
  const isToday=!!(filter&&filter.today);
  const [when,setWhen]=useState(isToday?'today':'all');         // today|yesterday|week|all
  const [statusF,setStatusF]=useState(isToday?'all':'NEW');     // NEW(未处理)|handled(已处理)|all

  };
  const scenSet=[...new Set((rows||[]).map(r=>r.scenario).filter(Boolean))];
  const agData=(()=>{const filtered=(rows||[]).filter(v=>{if(q&&!(v.employee||'').toLowerCase().includes(q.toLowerCase()))return false;if(lvl==='crit'&&v.risk_score<86)return false;if(lvl==='high'&&(v.risk_score<61||v.risk_score>85))return false;if(lvl==='mid'&&(v.risk_score<31||v.risk_score>60))return false;if(scenario!=='all'&&v.scenario!==scenario)return false;return true;});const ag={};filtered.forEach(v=>{if(!ag[v.employee])ag[v.employee]={key:v.employee,employee:v.employee,scenarios:[],maxRisk:0,count:0,latest:v.window_start,summary:'',verdict_id:v.verdict_id,intent:v.scenario};const g=ag[v.employee];const sc=INTENT[v.scenario]||v.scenario;if(!g.scenarios.find(s=>s.label===sc))g.scenarios.push({label:sc,risk:v.risk_score});if((v.risk_score||0)>g.maxRisk){g.maxRisk=v.risk_score;g.summary=v.summary;g.verdict_id=v.verdict_id;g.intent=v.scenario;}g.count++;if(v.window_start>g.latest)g.latest=v.window_start;});return Object.values(ag).sort((a,b)=>b.maxRisk-a.maxRisk);})();
  const alertN=agData.reduce((s,g)=>s+(g.count||0),0);

    </div>
    <Card className="card" size="small">
      <Space style={{marginBottom:8}} wrap>
        <Segmented value={when} onChange={setWhen} size="small" options={[
          {label:'今日',value:'today'},{label:'昨日',value:'yesterday'},{label:'近7天',value:'week'},{label:'全部',value:'all'}]}/>
        <Segmented value={statusF} onChange={setStatusF} size="small" options={[
          {label:'未处理',value:'NEW'},{label:'已处理',value:'handled'},{label:'全部状态',value:'all'}]}/>
        <Input.Search placeholder="搜索用户" allowClear style={{width:160}} onChange={e=>setQ(e.target.value)} />
        <Select value={lvl} style={{width:120}} onChange={setLvl}>
          <Select.Option value="all">全部风险</Select.Option>
          <Select.Option value="crit">严重86+</Select.Option>
          <Select.Option value="high">高危61-85</Select.Option>
          <Select.Option value="mid">关注31-60</Select.Option>

        columns={[
          {title:<TH t="用户" />,dataIndex:'employee',width:100,render:v=><a className="uname" onClick={(e)=>{e.stopPropagation();goProfile(v);}}>{v}</a>},

function Verdicts({goProfile,filter}){
  const isToday=filter&&filter.today; const tStr=new Date().toLocaleDateString('en-CA',{timeZone:'Asia/Shanghai'});
  const [rows,setRows]=useState(null); const [q,setQ]=useState(''); const [lvl,setLvl]=useState('all'); const [aisel,setAisel]=useState('all');
  const [merged,setMerged]=useState(true);  // 默认合并(同员工同意图),避免重复研判刷屏
  const [lastUpd,setLastUpd]=useState(null); const [loading,setLoading]=useState(true);
  const load=async()=>{const r=await GETL('/api/verdicts?limit=500');setRows(r);setLastUpd(new Date());setLoading(false);};
  useEffect(()=>{load();const t=setInterval(load,15000);return ()=>clearInterval(t);},[]);
  const filtered=(rows||[]).filter(v=>{
    if(isToday&&(v.window_start||'').slice(0,10)!==tStr)return false;
    if(q&&!(v.employee||'').toLowerCase().includes(q.toLowerCase()))return false;
    if(lvl==='crit'&&v.risk_score<86)return false;
    if(lvl==='high'&&(v.risk_score<61||v.risk_score>85))return false;
    if(lvl==='mid'&&(v.risk_score<31||v.risk_score>60))return false;
    if(aisel==='ai'&&!v.ai_participated)return false;
    if(aisel==='fallback'&&v.ai_participated)return false;
    return true;
  });
  const aiCnt=(rows||[]).filter(v=>v.ai_participated).length;
  // 合并视图: 同员工+同意图 聚合, 显示次数/最高分/最近/最新说明(消除重复研判噪音)
  const mergedData=(()=>{const ag={};filtered.forEach(v=>{const k=(v.employee||'?')+'|'+(v.intent||'?');if(!ag[k])ag[k]={key:k,employee:v.employee,intent:v.intent,count:0,maxRisk:0,latest:v.window_start,explanation:'',ai:1};const g=ag[k];g.count++;if((v.risk_score||0)>=g.maxRisk){g.maxRisk=v.risk_score;g.explanation=v.explanation;g.latest=v.window_start;}if(!v.ai_participated)g.ai=0;});return Object.values(ag).sort((a,b)=>b.maxRisk-a.maxRisk);})();
  const viewData = merged ? mergedData : filtered;
  return (<div>
    <div className="sec-title">研判记录 · AI 对每个可疑行为窗口的判定（告警 = 其中风险≥50 的子集）{isToday?' · 仅今日 ':''} · <span style={{fontSize:11,color:'var(--ink3)'}}>每15秒刷新{lastUpd&&' · '+lastUpd.toLocaleTimeString()} · {filtered.length}条研判 / 合并后 {mergedData.length} 组（AI {aiCnt} / 兜底 {(rows||[]).length-aiCnt}）</span></div>
    <Card className="card" size="small" title={<span><span className="brand-bar"></span>研判记录</span>}
      extra={<Segmented size="small" value={merged?'merge':'list'} onChange={v=>setMerged(v==='merge')} options={[{label:'合并视图',value:'merge'},{label:'逐条',value:'list'}]}/>}>
      <Space style={{marginBottom:10}} wrap>
        <Input.Search placeholder="搜索用户" allowClear style={{width:180}} onChange={e=>setQ(e.target.value)} />
        <Select value={lvl} style={{width:120}} onChange={setLvl}>
          <Select.Option value="all">全部风险</Select.Option>
          <Select.Option value="crit">严重86+</Select.Option>
          <Select.Option value="high">高危61-85</Select.Option>
          <Select.Option value="mid">关注31-60</Select.Option>
        </Select>
        <Select value={aisel} style={{width:120}} onChange={setAisel}>
          <Select.Option value="all">全部来源</Select.Option>
          <Select.Option value="ai">AI 判定</Select.Option>
          <Select.Option value="fallback">规则兜底</Select.Option>
        </Select>
      </Space>
      <Table size="small" rowKey={merged?'key':'id'} pagination={{pageSize:14,showTotal:t=>`共 ${t} ${merged?'组':'条'}${!merged&&t>=500?' (仅显示最近500条)':''}`}} loading={loading} dataSource={viewData}
        onRow={r=>({onClick:()=>goProfile(r.employee),style:{cursor:'pointer'}})}
        columns={merged?[
          {title:<TH t="用户" />,dataIndex:'employee',width:110,render:v=><span className="uname" style={{cursor:'inherit'}}>{v}</span>},
          {title:<TH t="意图" tip="AI判定的行为意图。数据外发/求职离职/行为偏离/违规/正常。" />,dataIndex:'intent',width:110,render:v=><Tag style={{background:'var(--brand-soft)',color:'var(--brand)',border:'1px solid var(--brand)'+'33'}}>{INTENT[v]||v}</Tag>},
          {title:<TH t="研判次数" tip="该员工+该意图被AI研判的总次数(合并前)。≥10次标橙,提示重复性风险。" />,dataIndex:'count',width:90,render:v=><span className="num" style={{fontWeight:700,color:v>=10?'var(--orange)':'var(--ink)'}}>{v}</span>},
          {title:<TH t="最高风险" tip="这些研判中的最高风险分(0-100)。86+严重/61+高危/31+关注。" />,dataIndex:'maxRisk',width:100,render:v=><RiskBadge s={v}/>},
          {title:<TH t="最近" tip="最近一次研判的时间(行为发生时间)。" />,dataIndex:'latest',width:140,render:v=><span style={{fontSize:11,color:'var(--ink2)'}}>{(v||'').replace('T',' ').slice(0,16)}</span>},
          {title:<TH t="最近一次说明" />,dataIndex:'explanation',render:v=><span style={{color:'var(--ink2)',fontSize:12,lineHeight:1.5,display:'-webkit-box',WebkitLineClamp:2,WebkitBoxOrient:'vertical',overflow:'hidden'}}>{v||'-'}</span>},
        ]:[
          {title:<TH t="用户" />,dataIndex:'employee',width:110,render:v=><span className="uname" style={{cursor:'inherit'}}>{v}</span>},
          {title:<TH t="时间" tip="研判窗口的起始时间(行为发生时间)。" />,dataIndex:'window_start',width:140,render:v=><span style={{fontSize:11,color:'var(--ink2)'}}>{(v||'').replace('T',' ').slice(0,16)}</span>},
          {title:<TH t="意图" tip="AI判定的行为意图。" />,dataIndex:'intent',width:110,render:v=><Tag style={{background:'var(--brand-soft)',color:'var(--brand)',border:'1px solid var(--brand)'+'33'}}>{INTENT[v]||v}</Tag>},
          {title:<TH t="风险" tip="AI对该行为窗口的打分(0-100)。" />,dataIndex:'risk_score',width:90,render:v=><RiskBadge s={v}/>},
          {title:<TH t="来源" tip="AI=大模型判定;兜底=LLM不可用时规则引擎判定。" />,dataIndex:'ai_participated',width:80,render:v=><Tag color={v?'green':'default'}>{v?'AI':'兜底'}</Tag>},
          {title:<TH t="说明" />,dataIndex:'explanation',render:v=><span style={{color:'var(--ink2)',fontSize:12,lineHeight:1.5,display:'-webkit-box',WebkitLineClamp:2,WebkitBoxOrient:'vertical',overflow:'hidden'}}>{v||'-'}</span>},
        ]}/>
    </Card>
  </div>);
}

function RawLogs(){

    setLoading(true);
    const params=new URLSearchParams();
    if(logType) params.set('log_type',logType);

        <span style={{fontSize:11,color:'#475569'}}>共 {total} 条（显示 {rows.length}）</span>
      </Space>
      <Table size="small" rowKey="id" pagination={{pageSize:20,showTotal:t=>'共 '+t+' 条'}} loading={loading} dataSource={rows}
        columns={[
          {title:'接收时间',dataIndex:'received_at',width:150,render:v=><span style={{fontSize:11,color:'#475569'}}>{(v||'').replace('T',' ').slice(0,19)}</span>},
          {title:'类型',dataIndex:'log_type',width:80,render:v=><Tag color={v==='url'?'blue':'default'}>{v||'?'}</Tag>},
          {title:'用户',dataIndex:'user',width:100},
          {title:'应用',dataIndex:'app',width:110,render:v=><span style={{fontSize:11}}>{v||'-'}</span>},
          {title:'报文原文',dataIndex:'msg',render:v=><span style={{fontFamily:'Consolas,monospace',fontSize:11,color:'#475569',wordBreak:'break-all',display:'block',maxHeight:60,overflow:'auto'}}>{v}</span>},
        ]}/>
    </Card>
  </div>);
}

function Ask(){
  const [msgs,setMsgs]=useState([]); const [q,setQ]=useState(''); const [sending,setSending]=useState(false);
  const send=async()=>{
    if(!q.trim()||sending)return;
    const question=q.trim(); setQ('');
    setMsgs(m=>[...m,{role:'user',text:question}]);
    setSending(true);
    const r=await POST('/api/ask',{headers:{'Content-Type':'application/json'},body:JSON.stringify({question})});
    setSending(false);
    setMsgs(m=>[...m,{role:'ai',text:(r&&r.answer)||'（无回答）'}]);
  };
  return (<div style={{display:'flex',flexDirection:'column',height:'calc(100vh - 150px)'}}>
    <div className="sec-title">AI 问答 · 基于行为数据回答 · <span style={{fontSize:11,color:'#94a3b8'}}>可问:某员工风险行为 / 告警榜 / 摸鱼榜 / 在岗情况 / 规则说明</span></div>
    <div style={{flex:1,minHeight:0,overflow:'auto',background:'#fff',border:'1px solid var(--line)',borderRadius:12,padding:12,boxShadow:'0 1px 3px rgba(15,23,42,.04)'}}>
      {msgs.length===0?<Empty description="提问开始对话（如：今天谁摸鱼最多？张三有什么风险行为？今天有哪些告警？）" style={{paddingTop:80}}/>:
        msgs.map((m,i)=><div key={i} style={{display:'flex',justifyContent:m.role==='user'?'flex-end':'flex-start',marginBottom:10}}>
          <div style={{maxWidth:'72%',padding:'9px 13px',borderRadius:12,background:m.role==='user'?'#4f46e5':'var(--bg)',color:m.role==='user'?'#fff':'#0f172a',whiteSpace:'pre-wrap',wordBreak:'break-word',lineHeight:1.6,boxShadow:'0 1px 2px rgba(15,23,42,.04)'}}>{m.text}</div>
        </div>)}
      {sending&&<div style={{color:'#94a3b8',fontSize:13,padding:'4px 8px'}}>AI 思考中…（查数据+总结，约10-20秒）</div>}
    </div>
    <div style={{marginTop:10,display:'flex',gap:8,alignItems:'flex-end'}}>
      <Input.TextArea value={q} onChange={e=>setQ(e.target.value)} onPressEnter={e=>{if(!e.shiftKey){e.preventDefault();send();}}} placeholder="提问…（回车发送，Shift+回车换行）" autoSize={{minRows:1,maxRows:4}} disabled={sending} style={{flex:1}}/>
      <Button type="primary" loading={sending} onClick={send}>发送</Button>
    </div>
  </div>);
}

function DictEditor({name,label,initial,onSave}){
  const [vals,setVals]=useState(initial||[]);
  useEffect(()=>{ setVals(initial||[]); },[initial]);
  return (<div style={{marginBottom:14}}>
    <Typography.Text strong style={{fontSize:13}}>{label}</Typography.Text>
    <Select mode="tags" style={{width:'100%'}} tokenSeparators={[',','，']} value={vals} onChange={setVals}/>
    <Button size="small" style={{marginTop:4}} onClick={()=>onSave(name,vals)}>保存</Button>
  </div>);
}
function Config(){
  const [cfg,setCfg]=useState({}); const [dicts,setDicts]=useState({}); const [syslog,setSyslog]=useState({}); const [saving,setSaving]=useState(false); const [excs,setExcs]=useState([]);
  const [sugs,setSugs]=useState(null); const [loadingSug,setLoadingSug]=useState(false);
  const [form]=Form.useForm();
  const load=async()=>{ const c=await GET('/api/config'); setCfg(c); form.setFieldsValue({base_url:c.llm_base_url,active:c.llm_active||'qwen',qwen_model:(c.qwen||{}).model,deepseek_model:(c.deepseek||{}).model,deepseek_base_url:(c.deepseek||{}).base_url}); setDicts(await GET('/api/dicts')); setSyslog(await GET('/api/syslog/status')); setExcs(await GETL('/api/exceptions')); };
  useEffect(()=>{ load(); const t=setInterval(()=>GET('/api/syslog/status').then(setSyslog),5000); return ()=>clearInterval(t); },[]);
  const saveLlm=async(v)=>{ setSaving(true); const body={llm_base_url:v.base_url,llm_active:v.active,llm_qwen_model:v.qwen_model,llm_deepseek_model:v.deepseek_model,llm_deepseek_base_url:v.deepseek_base_url||''};
    if(v.qwen_key) body.qwen_key=v.qwen_key; if(v.deepseek_key) body.deepseek_key=v.deepseek_key;
    await PUTJ('/api/config',body); setSaving(false); message.success('已保存'); load(); };
  const saveDict=async(n,val)=>{ await PUTJ('/api/dicts/'+n,val); message.success('已保存'); };
  const loadSugs=async()=>{ setLoadingSug(true); const r=await POST('/api/rules/suggest'); setSugs(r.suggestions||[]); setLoadingSug(false); };
  const applySug=async(s)=>{ await POST('/api/rules/apply',{headers:{'Content-Type':'application/json'},body:JSON.stringify({domain:s.domain,target_dict:s.target,cat:s.cat||''})}); message.success('已采纳 '+s.domain); setSugs((sugs||[]).filter(x=>x!==s)); };
  const delExc=async(id)=>{ await DEL('/api/exceptions/'+id); message.success('已删除豁免'); load(); };
  const toggleSys=async(on)=>{ await POST('/api/syslog/'+(on?'start':'stop')); message.success(on?'已启动':'已停止'); load(); };
  const uploadLog=f=>{ const fd=new FormData(); fd.append('file',f); message.loading({content:'导入中…',key:'up',duration:0});
    fetch('/api/ingest',{method:'POST',body:fd}).then(r=>r.json()).then(r=>message.success({content:'已导入 '+r.imported+' 条',key:'up',duration:2})); return false; };
  const DM={sensitive_keywords:'敏感文件名关键词',recruitment_sites:'招聘网站域名',netdisk_domains:'网盘域名',personal_email_domains:'个人邮箱域名',job_search_terms:'求职搜索词',risk_search_terms:'高危搜索词',work_domains:'工作网站白名单(算工作占比)',remote_control_domains:'远程控制工具(降权,凌晨才告警)',vpn_domains:'VPN/翻墙工具(访问即违规)',code_repo_domains:'代码仓库(降权,凌晨才告警)',wechat_file_domains:'微信文件助手(外发通道)'};
  return (
    <Tabs defaultActiveKey="monitor" items={[
      {key:'monitor', label:'系统监控', children:<Monitor/>},
      {key:'model', label:'模型配置', children:<Card className="card" title="模型配置（活动优先·失败自动切换）" size="small">
        <Form form={form} layout="vertical" onFinish={saveLlm}>
          <Form.Item label="接口地址" name="base_url"><Input placeholder="http://10.4.128.18:4000/v1"/></Form.Item>
          <Form.Item label="活动模型" name="active"><Radio.Group><Radio value="qwen">Qwen</Radio><Radio value="deepseek">DeepSeek</Radio></Radio.Group></Form.Item>
          <Form.Item label={'Qwen 模型（Key: '+((cfg.qwen||{}).key_masked||'无')+'）'} name="qwen_model"><Input placeholder="Qwen3-32B"/></Form.Item>
          <Form.Item label="Qwen 密钥（留空不改）" name="qwen_key"><Input.Password placeholder="sk-..."/></Form.Item>
          <Form.Item label={'DeepSeek 模型（Key: '+((cfg.deepseek||{}).key_masked||'无')+'）'} name="deepseek_model"><Input placeholder="deepseek"/></Form.Item>
          <Form.Item label="DeepSeek 接口地址" name="deepseek_base_url"><Input placeholder="http://10.0.20.249:4000/v1"/></Form.Item>
          <Form.Item label="DeepSeek 密钥（留空不改）" name="deepseek_key"><Input.Password placeholder="sk-..."/></Form.Item>
          <Button type="primary" htmlType="submit" loading={saving}>保存</Button>
        </Form>
      </Card>},
      {key:'syslog', label:'Syslog接收', children:<Card className="card" title="Syslog 实时接收" size="small">
        <div style={{marginBottom:8,color:'var(--ink2)',fontSize:13}}>监听地址：<b>{cfg.syslog_host||'0.0.0.0'}:{cfg.syslog_port||'8514'}</b></div>
        <div style={{marginBottom:8}}>
          <Typography.Text style={{fontSize:12}}>告警推送地址（留空不推）</Typography.Text>
          <Input placeholder="https://oapi.dingtalk.com/robot/send?access_token=..." defaultValue={cfg.notify_webhook||''} onChange={debounce(e=>PUTJ('/api/config',{notify_webhook:e.target.value}), 800)} />
        </div>
        <div style={{marginBottom:8}}><Badge status={syslog.enabled?'success':'default'} text={syslog.enabled?'监听中（已收 '+syslog.count+' 条，入库 '+syslog.ingested+' 条）':'未启用'}/>
          <Button size="small" type="primary" ghost={syslog.enabled} danger={syslog.enabled} onClick={()=>toggleSys(!syslog.enabled)} style={{marginLeft:8}}>{syslog.enabled?'停止':'启动'}</Button></div>
        {syslog.recent&&syslog.recent.length? <div style={{background:'var(--bg)',padding:8,fontSize:12,maxHeight:110,overflow:'auto',border:'1px solid var(--ink4)',borderRadius:6}}>
          {syslog.recent.map((m,i)=><div key={i} style={{whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis'}}><b>{m.t}</b> {m.from}: {m.msg.slice(0,80)}</div>)}</div>
          :<Typography.Text type="secondary" style={{fontSize:12}}>等待深信服推送（配好后自动接收→解析→研判）</Typography.Text>}
      </Card>},
      {key:'exempt', label:'豁免管理', children:<Card className="card" title={"误报复核 / 豁免管理（"+excs.length+"）"} size="small">
        {excs.length ? <Table size="small" rowKey="id" pagination={{pageSize:12}} dataSource={excs}
          columns={[
            {title:'用户',dataIndex:'employee',width:90},
            {title:'豁免场景',dataIndex:'signal_type',width:110,render:v=><Tag color="blue">{INTENT[v]||v}</Tag>},
            {title:'原因',dataIndex:'reason',ellipsis:true},
            {title:'有效期',dataIndex:'expires_at',width:110,render:v=>v?v.replace('T',' ').slice(0,10):'永久'},
            {title:'',width:70,render:(_,r)=><Button size="small" danger ghost onClick={()=>delExc(r.id)}>删除</Button>},
          ]}/> : <Typography.Text type="secondary" style={{fontSize:12}}>暂无豁免。在"告警管理"标记误报时会自动创建（被豁免的用户同类行为不再告警）。</Typography.Text>}
        <Alert type="info" showIcon style={{marginTop:8}} message="删除豁免后，该用户对应场景的行为会恢复告警。"/>
      </Card>},
      {key:'dict', label:'字典&AI规则', children:<>
        <Card className="card" title="AI 规则建议（扫未分类高频域名→AI 分类）" size="small" style={{marginBottom:16}}
          extra={<Button size="small" type="primary" loading={loadingSug} onClick={loadSugs}>{sugs?'重新扫描':'开始扫描'}</Button>}>
          {sugs===null ? <Typography.Text type="secondary" style={{fontSize:12}}>点击"开始扫描"，AI 分析高频未分类域名并建议归类，采纳后写入对应词库。</Typography.Text>:
           sugs.length===0 ? <Typography.Text type="secondary" style={{fontSize:12}}>暂无建议。</Typography.Text>:
           <Table size="small" rowKey="domain" pagination={{pageSize:8}} dataSource={sugs}
             columns={[
               {title:'域名',dataIndex:'domain',render:v=><span className="num" style={{fontSize:12}}>{v}</span>},
               {title:'命中',dataIndex:'hits',width:60,render:v=><span style={{color:'#94a3b8'}}>{v}</span>},
               {title:'AI建议',width:150,render:(_,r)=><Tag color={r.target==='ignore'?'default':r.target==='slack_domains'?'purple':'blue'}>{r.target==='ignore'?'忽略(正常)':(r.target==='slack_domains'?'摸鱼·'+(r.cat||''):{netdisk_domains:'网盘',personal_email_domains:'个人邮箱',recruitment_sites:'招聘',remote_control_domains:'远程控制',vpn_domains:'VPN/翻墙',code_repo_domains:'代码仓库',wechat_file_domains:'微信文件助手'}[r.target]||r.target)}</Tag>},
               {title:'理由',dataIndex:'reason',ellipsis:true,render:v=><span style={{fontSize:12,color:'var(--ink2)'}}>{v}</span>},
               {title:'',width:70,render:(_,r)=><Button size="small" type="primary" ghost disabled={r.target==='ignore'} onClick={()=>applySug(r)}>采纳</Button>},
             ]}/>}
          <Alert type="info" showIcon style={{marginTop:8}} message="AI 建议仅供参考，采纳后写入词库立即生效（影响后续研判）。不放心可忽略。"/>
        </Card>
        <Card className="card" title="检测字典（可选，默认全自动）" size="small" extra={<Upload showUploadList={false} beforeUpload={uploadLog}><Button size="small" type="primary">导入日志</Button></Upload>}>
          {Object.keys(DM).map(n=><DictEditor key={n} name={n} label={DM[n]} initial={dicts[n]} onSave={saveDict}/>)}
          <Alert type="info" showIcon style={{marginTop:8}} message="检测默认全自动（不依赖这些词）。标为误报的行为会自动豁免，下次同类不再告警。"/>
        </Card>
      </>},
    ]}/>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
