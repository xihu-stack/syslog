<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>用户行为分析系统</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="stylesheet" href="https://cdn.bootcdn.net/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link rel="stylesheet" href="https://cdn.bootcdn.net/ajax/libs/animate.css/4.1.1/animate.min.css">
<script src="/libs/react.js"></script>
<script src="/libs/react-dom.js"></script>
<script src="/libs/dayjs.js"></script>
<script src="/libs/antd.js"></script>
<script src="/libs/echarts.js"></script>
<script src="/libs/babel.js"></script>
<style>
  :root{
    /* 中性色 slate */
    --ink:#0f172a; --ink2:#475569; --ink3:#94a3b8; --ink4:#e2e8f0;
    --line:#eef2f7; --bg:#f6f8fb; --surface:#ffffff;
    /* 品牌靛紫 */
    --brand:#6366f1; --brand-soft:#eef2ff; --brand-deep:#4f46e5;
    /* 语义 */
    --danger:#ef4444; --danger-soft:#fef2f2;
    --warn:#f59e0b; --warn-soft:#fffbeb;
    --orange:#f97316; --orange-soft:#fff7ed;
    --ok:#22c55e; --ok-soft:#f0fdf4;
    /* 字号 token(5档:数字大/KPI/标题/正文/辅助/微) */
    --fs-xl:30px; --fs-lg:16px; --fs-md:13px; --fs-sm:12px; --fs-xs:11px;
    /* 圆角(更圆润) */
    --r:18px; --r-md:14px; --r-sm:10px;
    /* 阴影 */
    --sh-xs:0 1px 2px rgba(15,23,42,.04);
    --sh-sm:0 1px 3px rgba(15,23,42,.04),0 1px 2px rgba(15,23,42,.03);
    --sh-md:0 6px 16px rgba(15,23,42,.07),0 2px 4px rgba(15,23,42,.04);
    --sh-lg:0 16px 40px rgba(15,23,42,.12),0 4px 8px rgba(15,23,42,.05);
    /* 毛玻璃 */
    --glass:rgba(255,255,255,.72);
    --glass-blur:saturate(180%) blur(20px);
    /* 深色侧栏(Linear 风) */
    --sb-bg:#0b0f1a; --sb-bg2:#111726;
    --sb-fg:#94a3b8; --sb-fg-active:#fff; --sb-hover:rgba(255,255,255,.05);
    --sb-border:rgba(255,255,255,.06);
    /* 数字字体 */
    --mono:"SF Mono","JetBrains Mono","Roboto Mono",Consolas,"Liberation Mono",Menlo,monospace;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","HarmonyOS Sans","Microsoft YaHei",sans-serif;-webkit-font-smoothing:antialiased;font-size:var(--fs-md);}
  #root{min-height:100vh;}
  /* 数字:等宽字体 + tabular */
  .num{font-variant-numeric:tabular-nums;letter-spacing:-.3px;font-feature-settings:"tnum";font-family:var(--mono);}
  /* flex 列里的卡片撑满等高 */
  .ant-col[style*="display: flex"]>.card{flex:1;display:flex;flex-direction:column;}
  .ant-col[style*="display: flex"]>.card>.ant-card-body{flex:1;}
  /* 使用手册 */
  html{scroll-behavior:smooth;}
  .hb-nav-wrap{position:sticky;top:66px;}   /* 目录固定,跟随滚动高亮当前章节 */
  .hb-nav{display:flex;align-items:center;gap:9px;padding:8px 12px;border-radius:8px;color:var(--ink2);font-size:12.5px;text-decoration:none;transition:background .15s,color .15s;}
  .hb-nav.active{background:var(--brand-soft);color:var(--brand);font-weight:600;}
  .hb-nav.active .fa-solid{color:var(--brand);}
  .hb-nav .fa-solid{width:15px;text-align:center;color:var(--ink3);font-size:12px;}
  .hb-nav:hover{background:var(--brand-soft);color:var(--brand);}
  .hb-sec{margin-bottom:16px;scroll-margin-top:70px;}
  .hb-sec .ant-card-body{font-size:13px;color:var(--ink2);line-height:1.75;}
  .hb-sec p{margin:0 0 8px;}
  .hb-sec ul{margin:0 0 8px;padding-left:20px;}
  .hb-sec b{color:var(--ink);}
  .hb-sec code{background:var(--bg);padding:1px 6px;border-radius:4px;font-size:12px;}
  .hb-pre{background:var(--ink);color:#e2e8f0;border-radius:10px;padding:12px 14px;font-size:11.5px;line-height:1.7;font-family:var(--mono);overflow-x:auto;white-space:pre;margin:6px 0 8px;}
  .hb-tip{background:var(--brand-soft);border-left:3px solid var(--brand);border-radius:0 8px 8px 0;padding:8px 12px !important;font-size:12px;}
  .hb-row{display:flex;gap:12px;padding:8px 0;border-bottom:1px dashed var(--ink4);}
  .hb-row:last-child{border-bottom:none;}
  .hb-k{width:170px;flex-shrink:0;font-weight:600;color:var(--ink);}
  .hb-v{flex:1;}
  .uname{color:var(--ink) !important;font-weight:600;cursor:pointer;}
  .uname:hover{color:var(--brand) !important;}
  /* ===== 深色侧栏(Linear 风)===== */
  .ant-layout-sider{background:var(--sb-bg) !important;box-shadow:none !important;}
  /* 登录页:深空蓝底 + 星空/网格/光斑多层动态 + 流光卡片 */
  @property --lgA{syntax:'<angle>';initial-value:0deg;inherits:false;}
  .lg-page{min-height:100vh;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;background:linear-gradient(160deg,#141a3e 0%,#1a2154 55%,#1f2762 100%);padding:24px 16px;}
  .lg-stars,.lg-stars2{position:absolute;inset:-60px;pointer-events:none;z-index:2;
    background-image:
      radial-gradient(3.2px 3.2px at 18% 22%,#ffffff 0%,rgba(255,255,255,.75) 45%,transparent 80%),
      radial-gradient(2.6px 2.6px at 62% 12%,#dbe4ff 0%,rgba(219,228,255,.7) 45%,transparent 80%),
      radial-gradient(3px 3px at 82% 58%,#ffffff 0%,rgba(255,255,255,.65) 45%,transparent 80%),
      radial-gradient(2.4px 2.4px at 38% 74%,#c7d2fe 0%,rgba(199,210,254,.7) 45%,transparent 80%),
      radial-gradient(2.8px 2.8px at 12% 62%,#ffffff 0%,rgba(255,255,255,.7) 45%,transparent 80%),
      radial-gradient(2.4px 2.4px at 92% 34%,#eef2ff 0%,rgba(238,242,255,.7) 45%,transparent 80%),
      radial-gradient(2.6px 2.6px at 50% 44%,#ffffff 0%,rgba(255,255,255,.6) 45%,transparent 80%);
    background-size:340px 340px;}
  .lg-stars{animation:lgTwinkle 3.2s ease-in-out infinite alternate,lgStarDrift 70s linear infinite;}
  .lg-stars2{background-size:560px 560px;opacity:.75;animation:lgTwinkle 4.6s ease-in-out 1.2s infinite alternate,lgStarDrift2 110s linear infinite;}
  @keyframes lgTwinkle{from{opacity:.25}to{opacity:1}}
  @keyframes lgStarDrift{to{background-position:340px 170px}}
  @keyframes lgStarDrift2{to{background-position:-560px 280px}}
  .lg-const{position:absolute;inset:-60px;width:calc(100% + 120px);height:calc(100% + 120px);z-index:2;pointer-events:none;}
  .lg-const polyline{fill:none;stroke:rgba(165,180,252,.38);stroke-width:1;stroke-dasharray:5 7;animation:lgDash 26s linear infinite;}
  .lg-const circle{animation:lgTwinkle 4.2s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:center;}
  @keyframes lgDash{to{stroke-dashoffset:-312}}

  .lg-blob{position:absolute;border-radius:50%;pointer-events:none;z-index:1;}
  .lg-blob.b1{width:360px;height:360px;background:radial-gradient(circle,#818cf8,transparent 65%);opacity:.55;top:-60px;left:-40px;filter:blur(70px);animation:lgD1 13s ease-in-out infinite,lgHue 9s linear infinite;}
  .lg-blob.b2{width:430px;height:430px;background:radial-gradient(circle,#a78bfa,transparent 65%);opacity:.5;bottom:-100px;right:-60px;filter:blur(80px);animation:lgD2 16s ease-in-out infinite,lgHue 12s linear infinite reverse;}
  .lg-blob.b3{width:280px;height:280px;background:radial-gradient(circle,#22d3ee,transparent 65%);opacity:.4;top:34%;left:58%;filter:blur(70px);animation:lgD3 11s ease-in-out infinite,lgHue 8s linear infinite;}
  @keyframes lgD1{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(140px,90px) scale(1.25)}}
  @keyframes lgD2{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(-150px,-100px) scale(1.18)}}
  @keyframes lgD3{0%,100%{transform:translate(0,0) scale(1)}33%{transform:translate(-120px,80px) scale(1.2)}66%{transform:translate(100px,-90px) scale(.85)}}
  @keyframes lgHue{to{filter:blur(70px) hue-rotate(120deg)}}
  .lg-card{width:380px;max-width:100%;padding:34px 36px 26px;background:rgba(22,28,60,.58);backdrop-filter:blur(22px);border-radius:20px;border:1px solid rgba(255,255,255,.1);box-shadow:0 24px 60px rgba(0,0,0,.45),0 0 46px rgba(99,102,241,.14);position:relative;animation:lgGlow 4.5s ease-in-out infinite alternate;}
  .lg-card::before{content:"";position:absolute;inset:-1px;border-radius:21px;padding:1.2px;background:conic-gradient(from var(--lgA),transparent 0deg,transparent 250deg,rgba(129,140,248,.9) 310deg,transparent 360deg);
    -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);mask-composite:exclude;pointer-events:none;animation:lgBeam 5.5s linear infinite;}
  @keyframes lgBeam{to{--lgA:360deg}}
  @keyframes lgGlow{to{box-shadow:0 24px 60px rgba(0,0,0,.45),0 0 80px rgba(129,140,248,.28);}}
  .lg-card .ant-input-affix-wrapper,.lg-card .ant-input{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.14);color:#fff;}
  .lg-card .ant-input::placeholder{color:rgba(255,255,255,.38);}
  .lg-card .ant-input-password-icon{color:rgba(255,255,255,.45);}
  .lg-card .ant-input-affix-wrapper:focus,.lg-card .ant-input-affix-wrapper-focused{border-color:#818cf8;box-shadow:0 0 0 3px rgba(99,102,241,.22);}
  .logo{min-height:72px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:12px 14px;background:linear-gradient(180deg,var(--sb-bg2),var(--sb-bg));border-bottom:1px solid var(--sb-border);}
  .logo img{height:26px;display:block;max-width:calc(100% - 24px);object-fit:contain;}
  .logo s{text-decoration:none;color:var(--sb-fg);font-size:10.5px;letter-spacing:2px;}
  .logo .ic{width:30px;height:30px;border-radius:8px;background:linear-gradient(135deg,#6366f1,#8b5cf6);display:flex;align-items:center;justify-content:center;font-size:14px;color:#fff;flex-shrink:0;box-shadow:0 2px 8px rgba(99,102,241,.4);}
  .logo .tx{display:flex;flex-direction:column;line-height:1.2;}
  .logo .tx b{font-size:13px;color:#fff;font-weight:600;}
  .logo .tx s{font-size:10px;color:var(--sb-fg);text-decoration:none;letter-spacing:.5px;margin-top:1px;}
  /* 菜单分组标签 */
  .sb-group{color:#64748b;font-size:10px;font-weight:600;letter-spacing:1.5px;text-transform:uppercase;padding:14px 22px 6px;}
  /* 菜单底部状态 */
  .sb-foot{padding:12px 18px;border-top:1px solid var(--sb-border);margin-top:auto;}
  .sb-logout{margin-top:10px;padding:8px 10px;border-radius:8px;color:var(--sb-fg);font-size:12.5px;cursor:pointer;display:flex;align-items:center;gap:8px;transition:background .15s,color .15s;}
  .sb-logout:hover{background:rgba(248,113,113,.13);color:#f87171;}
  .sb-status{display:flex;align-items:center;gap:7px;font-size:11px;color:var(--sb-fg);}
  .sb-dot{width:7px;height:7px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 3px rgba(34,197,94,.15);}
  /* ===== KPI tile ===== */
  .tile{position:relative;background:var(--glass);backdrop-filter:var(--glass-blur);-webkit-backdrop-filter:var(--glass-blur);border-radius:var(--r);padding:20px 22px;cursor:pointer;transition:all .25s cubic-bezier(.4,0,.2,1);overflow:hidden;box-shadow:var(--sh-sm);}
  .tile:hover{box-shadow:var(--sh-md);transform:translateY(-2px);}
  .tile::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--brand);border-radius:0 2px 2px 0;opacity:0;transition:opacity .25s;}
  .tile:hover::before{opacity:1;}
  .tile .ic{position:absolute;right:18px;top:18px;width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:15px;background:var(--brand-soft);color:var(--brand);}
  .tile .v{font-size:var(--fs-xl);font-weight:700;color:var(--ink);letter-spacing:-.6px;line-height:1;}
  .tile.alert .v{color:var(--danger);}
  .tile.alert::before{background:var(--danger);opacity:1;}
  .tile.alert .ic{background:var(--danger-soft);color:var(--danger);}
  .tile .l{color:var(--ink2);font-size:var(--fs-sm);margin-top:10px;letter-spacing:.2px;font-weight:500;}
  .tile .sub{color:var(--ink3);font-size:var(--fs-xs);margin-top:3px;font-weight:400;}
  .tile .arr{position:absolute;right:16px;bottom:14px;color:var(--ink3);font-size:var(--fs-xs);opacity:0;transition:opacity .2s;}
  .tile:hover .arr{opacity:.7;}
  /* ===== 漏斗卡(用户视图) ===== */
  .uc-card{background:var(--surface);border-top:3px solid var(--ink4);border-radius:var(--r);padding:18px 20px;cursor:pointer;transition:all .25s cubic-bezier(.4,0,.2,1);box-shadow:var(--sh-sm);position:relative;}
  .uc-card:hover{box-shadow:var(--sh-md);transform:translateY(-2px);}
  .uc-v{font-size:26px;font-weight:700;line-height:1;letter-spacing:-.5px;font-variant-numeric:tabular-nums;}
  .uc-l{color:var(--ink2);font-size:var(--fs-sm);margin-top:8px;letter-spacing:.2px;font-weight:500;}
  .uc-sub{color:var(--ink3);font-size:var(--fs-xs);margin-left:6px;font-weight:400;}
  /* ===== 徽章/标签 ===== */
  .risk{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:var(--r-sm);font-weight:700;font-size:var(--fs-sm);letter-spacing:.2px;line-height:1.4;}
  .st-tag{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:var(--r-sm);font-size:var(--fs-xs);font-weight:600;letter-spacing:.2px;line-height:1.4;}
  .legend{display:flex;gap:18px;align-items:center;}
  .legend span{display:inline-flex;align-items:center;font-size:var(--fs-sm);color:var(--ink2);}
  .swatch{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:6px;}
  /* ===== 卡片(毛玻璃 + 圆润)===== */
  .card{border:none !important;border-radius:var(--r) !important;box-shadow:var(--sh-sm) !important;animation:cardIn .35s cubic-bezier(.4,0,.2,1) both;transition:box-shadow .25s,transform .25s !important;background:var(--glass) !important;backdrop-filter:var(--glass-blur);-webkit-backdrop-filter:var(--glass-blur);}
  .card:hover{box-shadow:var(--sh-md) !important;}
  @keyframes cardIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  @keyframes sk{0%{background-position:100% 50%}100%{background-position:0 50%}}
  .card>.ant-card-head{min-height:44px !important;border-bottom-color:var(--line) !important;padding:0 18px !important;}
  .card>.ant-card-head .ant-card-head-title{font-size:var(--fs-md);font-weight:600;color:var(--ink);letter-spacing:.2px;}
  .card>.ant-card-body{padding:14px 18px !important;}
  .sec-title{color:var(--ink2);font-size:var(--fs-sm);letter-spacing:.3px;margin:8px 2px 14px;font-weight:500;}
  .sec-fade{color:var(--ink3);}
  .brand-bar{display:inline-block;width:3px;height:15px;background:var(--brand);border-radius:2px;vertical-align:-2px;margin-right:9px;}
  /* ===== 大屏流程条 ===== */
  .flowbar{display:flex;align-items:stretch;background:var(--surface);border-radius:var(--r);padding:18px 20px;margin-bottom:18px;box-shadow:var(--sh-sm);}
  .flow-item{flex:1;min-width:90px;text-align:center;padding:4px 8px;cursor:pointer;transition:transform .2s;border-radius:var(--r-md);}
  .flow-item:hover{background:var(--brand-soft);}
  .flow-item:hover .fv{color:var(--brand);}
  .flow-item .fv{font-size:25px;font-weight:700;color:var(--ink);letter-spacing:-.5px;line-height:1;font-variant-numeric:tabular-nums;}
  .flow-item .fl{font-size:var(--fs-xs);color:var(--ink3);margin-top:8px;letter-spacing:.4px;font-weight:500;}
  .flow-arrow{color:var(--ink4);font-size:12px;display:flex;align-items:center;}
  .flow-tail{margin-left:auto;padding-left:20px;display:flex;align-items:center;font-size:var(--fs-sm);color:var(--ink3);white-space:nowrap;}
  /* ===== 画像时间线 ===== */
  .tl{border-left:2px solid var(--ink4);margin:6px 0 6px 4px;padding-left:22px;}
  .tl .it{margin:12px 0;font-size:var(--fs-md);color:var(--ink2);position:relative;}
  .tl .it::before{content:"";position:absolute;left:-20px;top:6px;width:10px;height:10px;border-radius:50%;background:var(--surface);border:2px solid var(--brand);}
  .tl .t{color:var(--ink3);font-size:var(--fs-xs);margin-top:3px;letter-spacing:.2px;}
  /* ===== 表格 ===== */
  .ant-table{border-radius:var(--r-md);overflow:hidden;}
  .ant-table-small>.ant-table-content .ant-table-tbody>tr>td,.ant-table-small>.ant-table-content .ant-table-thead>tr>th{padding:11px 10px !important;}
  .ant-table-thead>tr>th{background:var(--bg) !important;font-weight:600 !important;color:var(--ink2) !important;font-size:var(--fs-sm) !important;letter-spacing:.2px;border-bottom:1px solid var(--line) !important;}
  .ant-table-tbody>tr>td{border-bottom:1px solid var(--line) !important;}
  .ant-table-tbody>tr{transition:background .15s;}
  .ant-table-tbody>tr:hover>td{background:#f1f5f9 !important;}
  .ant-table-tbody>tr:last-child>td{border-bottom:none !important;}
  .row-crit{box-shadow:inset 4px 0 0 var(--danger);background:var(--danger-soft) !important;}
  .row-high{box-shadow:inset 4px 0 0 var(--orange);background:var(--orange-soft) !important;}
  .row-watch{box-shadow:inset 4px 0 0 var(--warn);}
  /* 用户视图行:只左侧细色条标示风险档,无背景色(保持表格干净) */
  .uv-crit{box-shadow:inset 3px 0 0 var(--danger);}
  .uv-high{box-shadow:inset 3px 0 0 var(--orange);}
  .uv-watch{box-shadow:inset 3px 0 0 #3b82f6;}
  /* ===== AntD 深度定制 ===== */
  .ant-statistic-content-value{color:var(--ink);font-weight:700 !important;letter-spacing:-.3px;font-family:var(--mono);font-variant-numeric:tabular-nums;}
  .ant-statistic-title{color:var(--ink2) !important;font-size:var(--fs-sm) !important;margin-bottom:4px !important;}
  /* 深色侧栏菜单 */
  .ant-menu-dark,.ant-menu{background:transparent !important;color:var(--sb-fg) !important;}
  .ant-menu-item-group-title{padding:0 !important;font-size:0 !important;line-height:0 !important;}
  .sb-group{display:inline-block;color:#64748b !important;font-size:10px !important;font-weight:600 !important;letter-spacing:1.5px;text-transform:uppercase;padding:14px 0 6px !important;}
  .ant-menu-item{font-size:var(--fs-md) !important;border-radius:var(--r-sm) !important;margin:2px 10px !important;width:calc(100% - 20px) !important;height:36px !important;line-height:36px !important;font-weight:500;color:var(--sb-fg) !important;display:flex !important;align-items:center;}
  .ant-menu-item>span>.fa-solid:first-child{margin-right:11px !important;width:15px;text-align:center;font-size:13px !important;opacity:.85;}
  .ant-menu-item:hover{color:#fff !important;background:var(--sb-hover) !important;}
  .ant-menu-item:hover .fa-solid{opacity:1 !important;}
  .ant-menu-item-selected{background:rgba(99,102,241,.18) !important;color:#fff !important;font-weight:600;box-shadow:inset 2px 0 0 var(--brand);}
  .ant-menu-item-selected .fa-solid{opacity:1;color:#a5b4fc !important;}
  .ant-menu-item-selected::after{display:none;}
  .ant-menu-item span span{flex:1;}
  .ant-btn{font-weight:500;border-radius:var(--r-sm) !important;height:32px;}
  .ant-btn-primary{background:var(--brand) !important;border-color:var(--brand) !important;box-shadow:0 2px 6px rgba(99,102,241,.25);}
  .ant-btn-primary:hover{background:var(--brand-deep) !important;border-color:var(--brand-deep) !important;}
  .ant-tag{font-size:var(--fs-xs);border-radius:var(--r-sm);padding:1px 8px;line-height:1.5;font-weight:500;}
  .ant-segmented{background:var(--bg) !important;border-radius:var(--r-md) !important;padding:2px;}
  .ant-segmented-item{border-radius:var(--r-sm) !important;font-size:var(--fs-sm) !important;font-weight:500;}
  .ant-segmented-item-selected{background:var(--surface) !important;box-shadow:var(--sh-xs);}
  .ant-tooltip-inner{font-size:var(--fs-sm);border-radius:var(--r-sm);}
  .ant-input,.ant-select-selector{border-radius:var(--r-sm) !important;}
  .ant-card-head-wrapper{align-items:center !important;}
  .ant-pagination-item,.ant-pagination-prev,.ant-pagination-next{border-radius:var(--r-sm) !important;}
  .ant-empty-description{color:var(--ink3);font-size:var(--fs-sm);}
  /* 进度条(效率榜摸鱼占比) */
  .pbar{width:56px;height:5px;background:var(--ink4);border-radius:3px;overflow:hidden;}
  .pbar>i{display:block;height:100%;border-radius:3px;}
  /* 链接 */

<script type="text/babel">
const { Layout, Menu, Card, Row, Col, Table, Tag, Button, Input, Form, message, Select, Modal,

/* AI问答会话: 模块级store + 服务端历史(跨浏览器/设备保留,切页后台继续生成) */
let _askStore={msgs:[],sending:false,subs:new Set(),loaded:false};
function _askSet(patch){ _askStore={..._askStore,...patch}; _askStore.subs.forEach(f=>f()); }
const _askSend=async(question)=>{
  if(!question||_askStore.sending)return;
  const ms=_askStore.msgs.slice(-6);
  const hist=[];
  ms.forEach((m,i)=>{ if(m.role==='user'){ const nxt=ms[i+1]; hist.push({q:m.text,a:(nxt&&nxt.role==='ai')?String(nxt.text).slice(0,300):''}); } });
  _askSet({msgs:[..._askStore.msgs,{role:'user',text:question}],sending:true});
  const r=await POST('/api/ask',{headers:{'Content-Type':'application/json'},body:JSON.stringify({question,history:hist.slice(-3)})});
  _askSet({msgs:[..._askStore.msgs,{role:'ai',text:(r&&r.answer)||'（无回答）'}],sending:false});
};
const _askLoad=async()=>{ const r=await GET('/api/ask/history'); if(r&&r.items) _askSet({msgs:r.items.flatMap(h=>[{role:'user',text:h.question},{role:'ai',text:h.answer}])}); };
const _askClear=async()=>{ await fetch('/api/ask/history',{method:'DELETE',headers:_authHdr()}); _askSet({msgs:[]}); };

const LVL = s => (s==null)?{c:'#94a3b8',l:'-'} : s>=76?{c:'#ef4444',l:'严重'} : s>=56?{c:'#f97316',l:'高危'} : s>=31?{c:'#3b82f6',l:'关注'} : {c:'#22c55e',l:'正常'};
const INTENT = {data_exfiltration:'数据外发', job_seeking:'求职离职', baseline_deviation:'行为偏离', policy_violation:'违规', normal_work:'正常', unknown:'未知', mass_delete:'大量删除'};
// 告警来源标签(2026-08-21): 实时(事件触发) / N+1复核(次日全天视野修正) / 聚合(行为聚合如大量删除)
const SRCTAG=(summary,scenario,ts)=>{
  if((summary||'').startsWith('[次日复核')) return {t:'N+1复核',c:'#6366f1',tip:'次日复核: R1用全天视野重新评估后的修正结论'};
  if(scenario==='mass_delete') return {t:'聚合',c:'#a855f7',tip:'行为聚合告警: 跨窗口聚合检测(如单日大量删除),10分钟级扫描'};
  const _td=new Date().toLocaleDateString('en-CA',{timeZone:'Asia/Shanghai'});
  if(ts&&String(ts).slice(0,10)<_td) return {t:'复核',c:'#3b82f6',tip:'今日前的历史告警: 已经过全量重判与复核流程,与今日实时分层查看'};
  return {t:'实时',c:'#22c55e',tip:'实时研判: 今日事件窗口触发,N+0层'};
};
const DEV = {none:'无', minor:'轻微', major:'重大', severe:'严重', unknown:'未知'};
const STATUS_MAP = {NEW:{c:'#ef4444',t:'待处理',i:'fa-clock'}, TRIAGING:{c:'#f59e0b',t:'处理中',i:'fa-spinner'}, CONFIRMED:{c:'#6366f1',t:'已知晓',i:'fa-circle-exclamation'}, FP:{c:'#94a3b8',t:'误报',i:'fa-xmark'}, CLOSED:{c:'#22c55e',t:'已关闭',i:'fa-circle-check'}};
// 防抖回调（延迟ms后执行，取消前序）
function debounce(fn, delay){ let t; return (...args) => { clearTimeout(t); t = setTimeout(()=>fn(...args), delay); }; }
const STATUS_OPTS = [{label:'待处理',value:'NEW'},{label:'处理中',value:'TRIAGING'},{label:'已知晓',value:'CONFIRMED'},{label:'误报',value:'FP'},{label:'已关闭',value:'CLOSED'}];
const fmt = s => (s||'').replace('T',' ').slice(0,16);
// ---- 登录态:token 存 localStorage;任何请求 401 → 清 token 重登 ----
const TOKEN_KEY='bg_token';
const _authHdr=()=>{const t=localStorage.getItem(TOKEN_KEY);return t?{'Authorization':'Bearer '+t}:{};};
const _on401=()=>{ if(localStorage.getItem(TOKEN_KEY)!==null){ localStorage.removeItem(TOKEN_KEY); location.reload(); } };
const _handle401=r=>{ if(r && r.status===401){ _on401(); throw new Error('401'); } return r; };
const GET = u=>fetch(u,{headers:_authHdr()}).then(_handle401).then(r=>r.ok?r.json():r.text().then(t=>Promise.reject(new Error('HTTP '+r.status)))).catch(e=>{console.error('GET '+u,e);return {};});
const GETL = u=>fetch(u,{headers:_authHdr()}).then(_handle401).then(r=>r.ok?r.json():r.text().then(t=>Promise.reject(new Error('HTTP '+r.status)))).then(d=>Array.isArray(d)?d:[]).catch(e=>{console.error('GETL '+u,e);return [];});
const POST=(u,o)=>fetch(u,{method:'POST',...o,headers:{...((o&&o.headers)||{}),..._authHdr()}}).then(_handle401).then(r=>r.ok?r.json():r.text().then(t=>Promise.reject(new Error('HTTP '+r.status)))).catch(e=>{console.error('POST '+u,e);message.error('请求失败');return {};});
const PUTJ=(u,b)=>fetch(u,{method:'PUT',headers:{'Content-Type':'application/json',..._authHdr()},body:JSON.stringify(b)}).then(_handle401).then(r=>r.ok?r.json():r.text().then(t=>Promise.reject(new Error('HTTP '+r.status)))).catch(e=>{console.error('PUT '+u,e);message.error('保存失败');return {};});
const DEL=(u)=>fetch(u,{method:'DELETE',headers:_authHdr()}).then(_handle401).then(r=>r.ok?r.json():r.text().then(t=>Promise.reject(new Error('HTTP '+r.status)))).catch(e=>{console.error('DEL '+u,e);message.error('删除失败');return {};});

function StatusTag({s}){ const v=STATUS_MAP[s]||{c:'#999',t:s}; return <span className="st-tag" style={{background:v.c+'1a',color:v.c}}>{v.i&&<i className={'fa-solid '+v.i} style={{marginRight:4,fontSize:11}}></i>}{v.t}</span>; }
const FROM_TITLE={computers:'用户视图',alerts:'告警工作台',verdicts:'研判记录',efficiency:'效率监控',dashboard:'安全总览'};

function LoginPage({onOk}){
  const [u,setU]=useState('admin'); const [p,setP]=useState(''); const [busy,setBusy]=useState(false); const [err,setErr]=useState('');
  const [ssoOn,setSsoOn]=useState(false); const [adminMode,setAdminMode]=useState(()=>{ try{ return new URLSearchParams(location.search).get('admin')==='1' }catch(e){ return false } });
  const [autoJump,setAutoJump]=useState(false);
  const goSso=()=>{ fetch('/api/auth/sso/start').then(r=>r.json()).then(r=>{ if(r&&r.url) location.href=r.url; else { setAutoJump(false); setErr('SSO未配置或未启用'); } }).catch(()=>{ setAutoJump(false); setErr('SSO启动失败'); }); };
  useEffect(()=>{ fetch('/api/auth/mode').then(r=>r.json()).then(r=>setSsoOn(!!(r&&r.sso_enabled))).catch(()=>{}); },[]);
  useEffect(()=>{  // SSO开启时未登录自动跳门户;守卫:回调落地参数不跳/每标签页只尝试一次(防循环)/管理员模式不跳
    if(!ssoOn||adminMode) return;
    const q=new URLSearchParams(location.search);
    if(q.get('sso_token')||q.get('sso_error')||q.get('admin')) return;
    let tried=false; try{ tried=sessionStorage.getItem('sso_auto_tried')==='1' }catch(e){}
    if(tried) return;
    try{ sessionStorage.setItem('sso_auto_tried','1') }catch(e){}
    setAutoJump(true);
    const tm=setTimeout(()=>goSso(),1600);
    return ()=>{ clearTimeout(tm); setAutoJump(false); };
  },[ssoOn,adminMode]);
  const pgRef=useRef(null);
  useEffect(()=>{  // 星空鼠标视差:两层星以不同深度缓动跟随鼠标(近层±22px/远层反向∓12px)
    const el=pgRef.current; if(!el) return;
    let tx=0,ty=0,cx=0,cy=0,raf;
    const onMove=e=>{ tx=(e.clientX/el.clientWidth-0.5)*2; ty=(e.clientY/el.clientHeight-0.5)*2; };
    const tick=()=>{ cx+=(tx-cx)*0.055; cy+=(ty-cy)*0.055;
      const s1=el.querySelector('.lg-stars'),s2=el.querySelector('.lg-stars2'),c=el.querySelector('.lg-const');
      if(s1) s1.style.transform=`translate(${cx*22}px,${cy*15}px)`;
      if(s2) s2.style.transform=`translate(${cx*-12}px,${cy*-9}px)`;
      if(c) c.style.transform=`translate(${cx*30}px,${cy*20}px)`;
      raf=requestAnimationFrame(tick); };
    el.addEventListener('mousemove',onMove); raf=requestAnimationFrame(tick);
    return ()=>{ el.removeEventListener('mousemove',onMove); cancelAnimationFrame(raf); };
  },[]);
  const doLogin=async()=>{
    if(busy) return; setBusy(true); setErr('');
    try{
      const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:u,password:p})});
      const d=r.ok?await r.json():null;
      if(d&&d.ok){ localStorage.setItem(TOKEN_KEY,d.token); onOk&&onOk(); }
      else setErr(d&&d.detail||'登录失败');
    }catch(e){ setErr('网络错误'); }
    setBusy(false);
  };
  return (<div className="lg-page" ref={pgRef}>
    <div className="lg-stars"/><div className="lg-stars2"/>
    <svg className="lg-const" viewBox="0 0 1000 700" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
      <defs>
        <filter id="lgGlow" x="-120%" y="-120%" width="340%" height="340%">
          <feGaussianBlur stdDeviation="2.4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
      </defs>
      <g id="lg-umd" filter="url(#lgGlow)">
        <polyline points="90,150 160,110 230,135 225,205 300,255 365,265 430,300 225,205 230,135"/>
        <circle cx="90" cy="150" r="3"/><circle cx="160" cy="110" r="2.6"/><circle cx="230" cy="135" r="2.8"/>
        <circle cx="225" cy="205" r="3.4"/><circle cx="300" cy="255" r="2.6"/><circle cx="365" cy="265" r="2.7"/><circle cx="430" cy="300" r="3"/>
      </g>
      <g filter="url(#lgGlow)">
        <polyline points="600,120 660,170 720,130 790,185 860,140"/>
        <circle cx="600" cy="120" r="3"/><circle cx="660" cy="170" r="2.6"/><circle cx="720" cy="130" r="3.2"/>
        <circle cx="790" cy="185" r="2.6"/><circle cx="860" cy="140" r="3"/>
      </g>
      <g filter="url(#lgGlow)">
        <polyline points="430,420 470,490 495,505 520,520 560,400 470,490 420,590 520,520 580,565"/>
        <circle cx="430" cy="420" r="2.8"/><circle cx="560" cy="400" r="2.9"/>
        <circle cx="470" cy="490" r="2.4"/><circle cx="495" cy="505" r="2.4"/><circle cx="520" cy="520" r="2.4"/>
        <circle cx="420" cy="590" r="3.1"/><circle cx="580" cy="565" r="3.3"/>
      </g>
    </svg>
    <div className="lg-blob b1"/><div className="lg-blob b2"/><div className="lg-blob b3"/>
    <div className="lg-card">
      <div style={{display:'flex',flexDirection:'column',alignItems:'center',gap:8,marginBottom:2}}>
        <img src="/logo.png" alt="HELIXON 华深智药" style={{height:40,display:'block',filter:'drop-shadow(0 0 16px rgba(99,102,241,.45))'}}/>
        <div style={{fontSize:12,color:'rgba(255,255,255,.62)',letterSpacing:6,textIndent:6}}>员工行为分析系统</div>
      </div>
      <Divider style={{margin:'14px 0 18px',borderColor:'rgba(255,255,255,.12)'}}/>
      {ssoOn&&!adminMode?(<div>
        {autoJump&&<div style={{marginBottom:12,textAlign:'center',fontSize:12,color:'#a5b4fc'}}><i className="fa-solid fa-spinner fa-spin" style={{marginRight:6}}></i>正在跳转到统一身份认证…</div>}
        {err&&!autoJump&&<div style={{color:'#f87171',fontSize:12,margin:'0 0 10px',textAlign:'center'}}><i className="fa-solid fa-circle-exclamation" style={{marginRight:5}}></i>{err}</div>}
        <Button size="large" block onClick={goSso} style={{height:46,fontWeight:600,fontSize:15}}><i className="fa-solid fa-arrow-right-to-bracket" style={{marginRight:8}}></i>统一身份认证登录</Button>
        <div style={{marginTop:14,fontSize:12,color:'rgba(255,255,255,.4)',textAlign:'center'}}>使用公司统一账号单点登录 · 无需单独密码</div>
        <div style={{marginTop:18,textAlign:'center'}}><a style={{fontSize:11,color:'rgba(255,255,255,.35)'}} onClick={()=>setAdminMode(true)}>管理员密码登录 ›</a></div>
      </div>):(<div>
      <div style={{fontSize:13,color:'rgba(255,255,255,.75)',marginBottom:16}}>{ssoOn?'本地管理员登录':'请输入管理员账号登录'}</div>
      <Input size="large" prefix={<i className="fa-solid fa-user" style={{color:'rgba(255,255,255,.4)'}}></i>} placeholder="用户名" value={u} onChange={e=>setU(e.target.value)} onPressEnter={doLogin} style={{marginBottom:12}}/>
      <Input.Password size="large" prefix={<i className="fa-solid fa-lock" style={{color:'rgba(255,255,255,.4)'}}></i>} placeholder="密码" value={p} onChange={e=>setP(e.target.value)} onPressEnter={doLogin} style={{marginBottom:6}}/>

      <Button type="primary" size="large" block loading={busy} onClick={doLogin} style={{marginTop:8,height:42,fontWeight:600}}>登 录</Button>
      {ssoOn&&<div style={{marginTop:12,textAlign:'center'}}><a style={{fontSize:11,color:'rgba(255,255,255,.35)'}} onClick={()=>setAdminMode(false)}>‹ 返回统一登录</a></div>}
      <div style={{marginTop:16,fontSize:11,color:'rgba(255,255,255,.38)',textAlign:'center'}}>{ssoOn?'本地管理员账号':'初始密码 admin123,登录后请在「系统设置→修改密码」更改'}</div>
      </div>)}
    </div>
  </div>);
}

function App(){
  // ---- 登录门:有 token 先探测 /api/me,无效/无 token 渲染登录页 ----
  const [authed,setAuthed]=useState(localStorage.getItem(TOKEN_KEY)?null:false);
  const [meName,setMeName]=useState('');
  // 全局搜索Hook(必须顶层,条件IIFE内调用会致#310;2026-08-21修复)
  const [sq,setSq]=useState(''); const [sres,setSres]=useState(null); const [sopen,setSopen]=useState(false);
  const doSearch=(v)=>{ setSq(v); if(v.trim().length<2){setSres(null);setSopen(false);return;}
    fetch('/api/search?q='+encodeURIComponent(v.trim()),{headers:_authHdr()})
      .then(r=>r.json()).then(r=>{setSres(r.results||[]);setSopen(true);}).catch(()=>{}); };
  useEffect(()=>{  // SSO回调落地: ?sso_token=一次性会话令牌 / ?sso_error=失败原因
    const q=new URLSearchParams(location.search);
    const t=q.get('sso_token');
    if(t){ localStorage.setItem(TOKEN_KEY,t); history.replaceState(null,'',location.pathname); setAuthed(true); }
    const e=q.get('sso_error');
    if(e){ history.replaceState(null,'',location.pathname); message.error({content:'SSO登录失败: '+e,key:'ssoerr',duration:5}); }
  },[]);
  useEffect(()=>{
    if(!localStorage.getItem(TOKEN_KEY)){ setAuthed(false); return; }
    fetch('/api/me',{headers:_authHdr()}).then(r=>r.ok?r.json():null).then(m=>{
      if(m&&m.ok){ setAuthed(true); setMeName(m.display||m.username||''); }
      else { localStorage.removeItem(TOKEN_KEY); setAuthed(false); }
    }).catch(()=>setAuthed(false));
  },[]);
  const [key,setKey]=useState('dashboard'); const [profileUser,setProfileUser]=useState(null); const [profileFrom,setProfileFrom]=useState('alerts');
  const [filter,setFilter]=useState({}); const navigate=(k,f={})=>{setFilter(f);setKey(k);};
  // 效率总结状态提升到 App：跨页保留上次结果 + 后台生成不随切页中断
  const [effItems,setEffItems]=useState(null); const [effLoading,setEffLoading]=useState(false); const [effMsg,setEffMsg]=useState('');
  const viewRef=useRef(key); viewRef.current=key;   // 完成回调时判断是否还在本页，决定是否弹通知
  const effGen=async()=>{
    if(effLoading) return;
    setEffLoading(true); setEffMsg('');
    const r=await GET('/api/efficiency/summary');
    const its=(r&&r.items)||[];
    let m=(r&&r.msg)||'';
    if(!r||(!r.items&&!r.msg)) m='生成失败,请稍后重试';   // GET 兜底返回 {} 时区分错误与真空
    setEffItems(its); setEffMsg(m); setEffLoading(false);
    if(r&&(r.items||r.msg)&&viewRef.current!=='efficiency') message.info('AI 摸鱼总结已生成，可在「效率监控」查看');
  };
  const [now,setNow]=useState('');
  useEffect(()=>{ const f=()=>setNow(new Date().toLocaleString('zh-CN',{hour12:false})); f(); const t=setInterval(f,1000); return ()=>clearInterval(t); },[]);
  const pollDetect=()=>{
    const tick=()=>fetch('/api/detect/status',{headers:_authHdr()}).then(r=>r.json()).then(s=>{
      if(s.running){
        const pct = s.total ? Math.round(s.done/s.total*100) : 0;
        const ph = s.phase ? s.phase : '';
        const txt = ph && !s.total ? ph : (ph ? ph+' '+s.done+'/'+s.total+' ('+pct+'%)' : '研判中 '+s.done+'/'+s.total+' ('+pct+'%)');
        message.loading({content:txt,key:'det',duration:0});
        setTimeout(tick,3000);
      } else {
        message.success({content:'研判完成：'+s.judged+' 窗口，告警 '+s.alerts,key:'det',duration:3});
        setTimeout(()=>location.reload(),1000);
      }
    });
    tick();
  };
  // 页面加载时自动检测是否有正在运行的研判
  useEffect(()=>{ fetch('/api/detect/status',{headers:_authHdr()}).then(r=>r.json()).then(s=>{ if(s.running&&s.total>0) pollDetect(); }); },[]);
  const uploadLog=f=>{ const fd=new FormData(); fd.append('file',f);
    message.loading({content:'导入中…',key:'up',duration:0});
    fetch('/api/ingest',{method:'POST',headers:_authHdr(),body:fd}).then(r=>r.json()).then(r=>{ message.success({content:'已导入 '+r.imported+' 条，开始研判…',key:'up',duration:2}); pollDetect(); }); return false; };
  if(authed===null) return <div style={{minHeight:'100vh',display:'flex',alignItems:'center',justifyContent:'center',background:'var(--bg)',color:'var(--ink3)'}}>检查登录状态…</div>;
  if(!authed) return <LoginPage onOk={()=>setAuthed(true)}/>;
  return (
    <ConfigProvider theme={{token:{colorPrimary:'#6366f1',borderRadius:8,colorText:'#0f172a',colorTextSecondary:'#475569',fontFamily:'inherit'}}}>
    <Layout style={{minHeight:'100vh'}}>
      <Sider width={222} theme="dark" style={{background:'var(--sb-bg)',position:'fixed',left:0,top:0,bottom:0,height:'100vh',overflowY:'auto',display:'flex',flexDirection:'column'}}>
        <div className="logo"><img src="/logo.png" alt="HELIXON 华深智药"/><s>员工行为分析系统</s></div>
        <Menu mode="inline" theme="dark" selectedKeys={[key==='profile'?(profileFrom||'alerts'):key]} onClick={e=>navigate(e.key)} style={{background:'transparent',borderRight:'none',paddingTop:6}}

    {k:'high',  label:'高危',     sub:'56-75', value:base.filter(r=>{const x=r.max_risk||0;return x>=56&&x<76;}).length, color:'#f97316', icon:'fa-triangle-exclamation'},

        <span>当前 <b className="num" style={{color:'var(--ink)',fontSize:14}}>{filtered.length}</b> / {base.length} 人{isToday?' (今日)':''} · {isToday?'今日':''}事件 <b className="num">{evtTotal}</b></span>

function Verdicts({goProfile,filter}){
  const isToday=filter&&filter.today; const tStr=new Date().toLocaleDateString('en-CA',{timeZone:'Asia/Shanghai'});
  const [rows,setRows]=useState(null); const [q,setQ]=useState(''); const [lvl,setLvl]=useState('all'); const [aisel,setAisel]=useState('all');
  const [merged,setMerged]=useState(true);  // 默认合并(同员工同意图),避免重复研判刷屏
  const [lastUpd,setLastUpd]=useState(null); const [loading,setLoading]=useState(true);
  const load=async()=>{const r=await GETL('/api/verdicts?limit=500');setRows(r);setLastUpd(new Date());setLoading(false);};
  useEffect(()=>{load();const t=setInterval(load,15000);return ()=>clearInterval(t);},[]);
  const filtered=(rows||[]).filter(v=>{
    if(isToday&&(v.window_start||'').slice(0,10)!==tStr)return false;
    if(q&&!(v.employee||'').toLowerCase().includes(q.toLowerCase()))return false;
    if(lvl==='crit'&&v.risk_score<76)return false;
    if(lvl==='high'&&(v.risk_score<56||v.risk_score>75))return false;
    if(lvl==='mid'&&(v.risk_score<31||v.risk_score>55))return false;
    if(aisel==='ai'&&!v.ai_participated)return false;
    if(aisel==='fallback'&&v.ai_participated)return false;
    return true;
  });
  const aiCnt=(rows||[]).filter(v=>v.ai_participated).length;
  // 合并视图: 同员工+同意图 聚合, 显示次数/最高分/最近/最新说明(消除重复研判噪音)
  const mergedData=(()=>{const ag={};filtered.forEach(v=>{const k=(v.employee||'?')+'|'+(v.intent||'?');if(!ag[k])ag[k]={key:k,employee:v.employee,intent:v.intent,count:0,maxRisk:0,latest:v.window_start,explanation:'',ai:1};const g=ag[k];g.count++;if((v.risk_score||0)>=g.maxRisk){g.maxRisk=v.risk_score;g.explanation=v.explanation;g.latest=v.window_start;}if(!v.ai_participated)g.ai=0;});return Object.values(ag).sort((a,b)=>b.maxRisk-a.maxRisk);})();
  const viewData = merged ? mergedData : filtered;
  return (<div>
    <div className="sec-title">研判记录 · AI 对每个可疑行为窗口的判定（告警 = 其中风险≥50 的子集）{isToday?' · 仅今日 ':''} · <span style={{fontSize:11,color:'var(--ink3)'}}>每15秒刷新{lastUpd&&' · '+lastUpd.toLocaleTimeString()} · {filtered.length}条研判 / 合并后 {mergedData.length} 组（AI {aiCnt} / 兜底 {(rows||[]).length-aiCnt}）</span></div>
    <Card className="card" size="small" title={<span><span className="brand-bar"></span>研判记录</span>}
      extra={<Segmented size="small" value={merged?'merge':'list'} onChange={v=>setMerged(v==='merge')} options={[{label:'合并视图',value:'merge'},{label:'逐条',value:'list'}]}/>}>
      <Space style={{marginBottom:10}} wrap>
        <Input.Search placeholder="搜索用户" allowClear style={{width:180}} onChange={e=>setQ(e.target.value)} />
        <Select value={lvl} style={{width:120}} onChange={setLvl}>
          <Select.Option value="all">全部风险</Select.Option>
          <Select.Option value="crit">严重76+</Select.Option>
          <Select.Option value="high">高危56-75</Select.Option>
          <Select.Option value="mid">关注31-55</Select.Option>
        </Select>
        <Select value={aisel} style={{width:120}} onChange={setAisel}>
          <Select.Option value="all">全部来源</Select.Option>
          <Select.Option value="ai">AI 判定</Select.Option>
          <Select.Option value="fallback">规则兜底</Select.Option>
        </Select>
      </Space>
      <Table size="small" rowKey={merged?'key':'id'} pagination={{pageSize:14,showTotal:t=>`共 ${t} ${merged?'组':'条'}${!merged&&t>=500?' (仅显示最近500条)':''}`}} loading={loading} dataSource={viewData}
        onRow={r=>({onClick:()=>goProfile(r.employee),title:r.summary,style:{cursor:'pointer'}})}
        columns={merged?[
          {title:<TH t="用户" />,dataIndex:'employee',width:110,render:v=><span className="uname" style={{cursor:'inherit'}}>{v&&v.startsWith('IPG:')?v+'(待匹配)':v}</span>},
          {title:<TH t="意图" tip="AI判定的行为意图。数据外发/求职离职/行为偏离/违规/正常。" />,dataIndex:'intent',width:110,render:v=><Tag style={{background:'var(--brand-soft)',color:'var(--brand)',border:'1px solid var(--brand)'+'33'}}>{INTENT[v]||v}</Tag>},
          {title:<TH t="研判次数" tip="该员工+该意图被AI研判的总次数(合并前)。≥10次标橙,提示重复性风险。" />,dataIndex:'count',width:90,render:v=><span className="num" style={{fontWeight:700,color:v>=10?'var(--orange)':'var(--ink)'}}>{v}</span>},
          {title:<TH t="最高风险" tip="这些研判中的最高风险分(0-100)。76+严重/56+高危/31+关注。" />,dataIndex:'maxRisk',width:100,render:v=><RiskBadge s={v}/>},
          {title:<TH t="最近" tip="最近一次研判的时间(行为发生时间)。" />,dataIndex:'latest',width:140,render:v=><span style={{fontSize:11,color:'var(--ink2)'}}>{(v||'').replace('T',' ').slice(0,16)}</span>},
          {title:<TH t="最近一次说明" />,dataIndex:'explanation',render:v=><span title={v} style={{color:'var(--ink2)',fontSize:12,lineHeight:1.5,display:'-webkit-box',WebkitLineClamp:2,WebkitBoxOrient:'vertical',overflow:'hidden'}}>{v||'-'}</span>},
        ]:[
          {title:<TH t="用户" />,dataIndex:'employee',width:110,render:v=><span className="uname" style={{cursor:'inherit'}}>{v&&v.startsWith('IPG:')?v+'(待匹配)':v}</span>},
          {title:<TH t="时间" tip="研判窗口的起始时间(行为发生时间)。" />,dataIndex:'window_start',width:140,render:v=><span style={{fontSize:11,color:'var(--ink2)'}}>{(v||'').replace('T',' ').slice(0,16)}</span>},
          {title:<TH t="意图" tip="AI判定的行为意图。" />,dataIndex:'intent',width:110,render:v=><Tag style={{background:'var(--brand-soft)',color:'var(--brand)',border:'1px solid var(--brand)'+'33'}}>{INTENT[v]||v}</Tag>},
          {title:<TH t="风险" tip="AI对该行为窗口的打分(0-100)。" />,dataIndex:'risk_score',width:90,render:v=><RiskBadge s={v}/>},
          {title:<TH t="来源" tip="AI=大模型判定;兜底=LLM不可用时规则引擎判定。" />,dataIndex:'ai_participated',width:80,render:v=><Tag color={v?'green':'default'}>{v?'AI':'兜底'}</Tag>},
          {title:<TH t="说明" />,dataIndex:'explanation',render:v=><span title={v} style={{color:'var(--ink2)',fontSize:12,lineHeight:1.5,display:'-webkit-box',WebkitLineClamp:2,WebkitBoxOrient:'vertical',overflow:'hidden'}}>{v||'-'}</span>},
        ]}/>
    </Card>
  </div>);
}

function RawLogs(){
  const [rows,setRows]=useState([]); const [total,setTotal]=useState(0); const [loading,setLoading]=useState(true);
  const [logType,setLogType]=useState(''); const [uq,setUq]=useState(''); const [kw,setKw]=useState(''); const [dr,setDr]=useState(null);
  const load=async()=>{
    setLoading(true);
    const params=new URLSearchParams();
    if(logType) params.set('log_type',logType);
    if(uq) params.set('user',uq);
    if(kw) params.set('kw',kw);
    if(dr&&dr[0]) params.set('start',dr[0].format('YYYY-MM-DD 00:00:00'));
    if(dr&&dr[1]) params.set('end',dr[1].format('YYYY-MM-DD 23:59:59'));
    params.set('limit','2000');
    const r=await GET('/api/raw_logs?'+params.toString());
    setRows((r&&r.items)||[]); setTotal((r&&r.total)||0); setLoading(false);

function Ask(){
  const store=useSyncExternalStore(cb=>{_askStore.subs.add(cb);return()=>_askStore.subs.delete(cb);},()=>_askStore);
  const [q,setQ]=useState('');
  const boxRef=useRef(null);
  useEffect(()=>{ if(!_askStore.loaded){ _askStore.loaded=true; _askLoad(); } },[]);
  const msgs=store.msgs; const sending=store.sending;
  const send=()=>{ if(!q.trim()||sending)return; const question=q.trim(); setQ(''); _askSend(question); };
  useEffect(()=>{ if(boxRef.current) boxRef.current.scrollTop=boxRef.current.scrollHeight; },[msgs.length,sending]);
  return (<div style={{display:'flex',flexDirection:'column',maxWidth:920,margin:'0 auto',width:'100%'}}>
    <div className="sec-title">AI 问答 · 基于行为数据回答 · <span style={{fontSize:11,color:'#94a3b8'}}>可问:某员工风险行为 / 告警榜 / 摸鱼榜 / 在岗情况 / 规则说明 · 对话跨页保留</span>
      {msgs.length>0&&<a style={{marginLeft:12,fontSize:11,color:'var(--ink3)',cursor:'pointer'}} onClick={_askClear}><i className="fa-solid fa-eraser" style={{marginRight:4}}></i>清空对话</a>}
    </div>
    <div ref={boxRef} style={{minHeight:200,maxHeight:'calc(100vh - 280px)',overflow:'auto',background:'#fff',border:'1px solid var(--line)',borderRadius:12,padding:12,boxShadow:'0 1px 3px rgba(15,23,42,.04)'}}>
      {msgs.length===0?<Empty description="提问开始对话（如：今天谁摸鱼最多？张三有什么风险行为？今天有哪些告警？）" style={{paddingTop:60}}/>:
        msgs.map((m,i)=><div key={i} style={{display:'flex',justifyContent:m.role==='user'?'flex-end':'flex-start',marginBottom:10}}>
          <div style={{maxWidth:'72%',padding:'9px 13px',borderRadius:12,background:m.role==='user'?'#4f46e5':'var(--bg)',color:m.role==='user'?'#fff':'#0f172a',whiteSpace:'pre-wrap',wordBreak:'break-word',lineHeight:1.6,boxShadow:'0 1px 2px rgba(15,23,42,.04)'}}>{m.text}</div>
        </div>)}
      {sending&&<div style={{color:'#94a3b8',fontSize:13,padding:'4px 8px'}}>AI 思考中…（查数据+总结，约10-20秒，可切到其他页面，回来仍在）</div>}
    </div>
    <div style={{marginTop:10,background:'#fff',border:'1px solid var(--line)',borderRadius:12,padding:'10px 12px',boxShadow:'0 1px 3px rgba(15,23,42,.04)'}}>
      <div style={{display:'flex',gap:8,alignItems:'flex-end'}}>
        <Input.TextArea value={q} onChange={e=>setQ(e.target.value)} onPressEnter={e=>{if(!e.shiftKey){e.preventDefault();send();}}} placeholder="提问…（回车发送，Shift+回车换行）" autoSize={{minRows:2,maxRows:6}} disabled={sending} style={{flex:1,fontSize:14}}/>
        <Button type="primary" loading={sending} onClick={send}>发送</Button>
      </div>
    </div>
  </div>);
}

function DictEditor({name,label,initial,onSave}){
  const [vals,setVals]=useState(initial||[]);
  useEffect(()=>{ setVals(initial||[]); },[initial]);
  return (<div style={{marginBottom:14}}>
    <Typography.Text strong style={{fontSize:13}}>{label}</Typography.Text>
    <Select mode="tags" style={{width:'100%'}} tokenSeparators={[',','，']} value={vals} onChange={setVals}/>
    <Button size="small" style={{marginTop:4}} onClick={()=>onSave(name,vals)}>保存</Button>
  </div>);
}

function PwdCard(){

    setBusy(true);

    if(r&&r.ok){ message.success('密码已修改,请用新密码重新登录'); setTimeout(()=>{ localStorage.removeItem(TOKEN_KEY); location.reload(); },1200); }

    const r=await POST('/api/alias/confirm',{headers:{'Content-Type':'application/json'},body:JSON.stringify({account,name})});
    message.success('已统一: '+account+' → '+name+(r&&r.updated_rows?(' (历史数据更新'+r.updated_rows+'行)'):''));
    load();
  };
  const del=async(a)=>{ await DEL('/api/alias/'+encodeURIComponent(a)); message.success('已删除'); load(); };
  const ignore=async(a)=>{ await POST('/api/alias/ignore',{headers:{'Content-Type':'application/json'},body:JSON.stringify({account:a})}); message.success('已忽略(不再提示)'); load(); };
  const conf=(data&&data.confirmed)||{};
  const pendEntries=Object.entries((data&&data.pending)||{}).map(([a,v])=>{ const o=(typeof v==='string')?{guess:v}:v; return {account:a,guess:o.guess||'',candidates:o.candidates||[],reason:o.reason||'',count:o.count||0,last_seen:o.last_seen||''}; });
  const ignored=(data&&data.ignored)||[];
  return (<div>
    <Alert type='info' showIcon style={{marginBottom:12}} message='所有非中文标识(域账号/拼音)都会被提取到待确认清单: 拼音唯一命中自动生效;拼音撞名给出候选(点击填入);其余请人工填写中文名。确认后立即生效——新数据入库自动转换,历史数据同步清洗。IP型标识因DHCP动态分配无法关联员工,建议忽略。'/>
    <Card className='card' size='small' title={'待确认 ('+pendEntries.length+') · 每小时自动扫描'} style={{marginBottom:16}}>
      {pendEntries.length===0?<Typography.Text type='secondary' style={{fontSize:12}}>暂无待确认标识——当前所有用户标识均为中文或已映射</Typography.Text>:
      <Table size='small' rowKey='account' pagination={{pageSize:10}} dataSource={pendEntries}
        columns={[
          {title:'非中文标识',dataIndex:'account',render:v=><span className='num' style={{fontSize:12}}>{v}</span>},
          {title:'线索',dataIndex:'reason',width:170,render:v=><Tag style={{fontSize:11}}>{v||'-'}</Tag>},
          {title:'候选(点击填入)',width:180,render:(_,r)=>r.candidates.length?r.candidates.map(c=><Tag key={c} style={{cursor:'pointer',fontSize:11,marginBottom:2}} onClick={()=>setFix({...fix,[r.account]:c})}>{c}</Tag>):<span style={{color:'var(--ink3)',fontSize:11}}>-</span>},
          {title:'近30天',width:110,render:(_,r)=><span style={{fontSize:11,color:r.count?'var(--ink2)':'var(--ink3)'}}>{r.count?r.count+'条 · '+(r.last_seen||'').slice(5,10):'无活动'}</span>},
          {title:'确认为中文名',width:230,render:(_,r)=><Space.Compact>
            <Input size='small' style={{width:110}} placeholder='中文名' value={fix[r.account]!==undefined?fix[r.account]:r.guess} onChange={e=>setFix({...fix,[r.account]:e.target.value})} onPressEnter={()=>{ if(fix[r.account]||r.guess){confirm(r.account, fix[r.account]||r.guess); setFix({...fix,[r.account]:undefined});} }}/>
            <Button size='small' type='primary' disabled={!(fix[r.account]||r.guess)} onClick={()=>{ confirm(r.account, fix[r.account]||r.guess); setFix({...fix,[r.account]:undefined}); }}>确认</Button>
            <Button size='small' onClick={()=>ignore(r.account)}>忽略</Button>
          </Space.Compact>},
        ]}/>}
      {ignored.length>0&&<div style={{marginTop:8,fontSize:11,color:'var(--ink3)'}}>已忽略({ignored.length}): {ignored.slice(0,8).map(a=><Tag key={a} style={{fontSize:10}}>{a}</Tag>)}{ignored.length>8?' …':''}</div>}
    </Card>
    <Card className='card' size='small' title={'已生效映射 ('+Object.keys(conf).length+')'} style={{marginBottom:16}}>
      {Object.keys(conf).length===0?<Typography.Text type='secondary' style={{fontSize:12}}>暂无</Typography.Text>:
      <Table size='small' rowKey='account' pagination={{pageSize:10}} dataSource={Object.entries(conf).map(([a,n])=>({account:a,name:n}))}
        columns={[
          {title:'账号/IP标识',dataIndex:'account',render:v=><span className='num' style={{fontSize:12}}>{v}</span>},
          {title:'中文名',dataIndex:'name',render:v=><b>{v}</b>},
          {title:'',width:60,render:(_,r)=><Button size='small' danger ghost onClick={()=>del(r.account)}>删除</Button>},
        ]}/>}
    </Card>
    <Card className='card' size='small' title='手动添加映射'>
      <Space>
        <Input placeholder='账号(如 zhangsan 或 10.4.x.x)' style={{width:200}} value={na} onChange={e=>setNa(e.target.value)}/>
        <Input placeholder='中文名' style={{width:120}} value={nn} onChange={e=>setNn(e.target.value)}/>
        <Button type='primary' onClick={()=>{ if(na&&nn){confirm(na.trim(),nn.trim()); setNa(''); setNn('');} }}>添加</Button>
      </Space>
    </Card>
  </div>);
}

function Config(){

    await PUTJ('/api/config',body); setSaving(false); message.success('已保存'); load(); };
  const saveDict=async(n,val)=>{ await PUTJ('/api/dicts/'+n,val); message.success('已保存'); };

  const [autoSug,setAutoSug]=useState(null);
  useEffect(()=>{ GET('/api/rules/auto').then(setAutoSug).catch(()=>{}); },[]);
  const applySug=async(s,target)=>{
    // suspect_new 是"AI不确定归哪类",采纳时必须人工指定真实字典(防误归类)
    const tgt = target || (s.target==='suspect_new' ? null : s.target);
    if(!tgt){ setSugModal(s); return; }  // 弹选择框
    await POST('/api/rules/apply',{headers:{'Content-Type':'application/json'},body:JSON.stringify({domain:s.domain,target_dict:tgt,cat:s.cat||''})});
    message.success('已采纳 '+s.domain+' → '+({netdisk_domains:'网盘',personal_email_domains:'邮箱',recruitment_sites:'招聘',remote_control_domains:'远程控制',vpn_domains:'VPN',code_repo_domains:'代码仓库',wechat_file_domains:'微信文件助手',ai_assistant_domains:'AI助手',slack_domains:'摸鱼'}[tgt]||tgt));
    setSugs((sugs||[]).filter(x=>x!==s)); setSugModal(null);
  };
  const delExc=async(id)=>{ await DEL('/api/exceptions/'+id); message.success('已删除豁免'); load(); };
  const toggleSys=async(on)=>{ await POST('/api/syslog/'+(on?'start':'stop')); message.success(on?'已启动':'已停止'); load(); };
  const uploadLog=f=>{ const fd=new FormData(); fd.append('file',f); message.loading({content:'导入中…',key:'up',duration:0});
    fetch('/api/ingest',{method:'POST',headers:_authHdr(),body:fd}).then(r=>r.json()).then(r=>message.success({content:'已导入 '+r.imported+' 条',key:'up',duration:2})); return false; };
  const DM={sensitive_keywords:'敏感文件名关键词',recruitment_sites:'招聘网站域名',netdisk_domains:'网盘域名',personal_email_domains:'个人邮箱域名',job_search_terms:'求职搜索词',risk_search_terms:'高危搜索词',work_domains:'工作网站白名单(算工作占比)',remote_control_domains:'远程控制工具(降权,凌晨才告警)',vpn_domains:'VPN/翻墙工具(已停用·翻墙非违规)',code_repo_domains:'代码仓库(降权,凌晨才告警)',wechat_file_domains:'微信文件助手(外发通道)',ai_assistant_domains:'AI助手(ChatGPT/DeepSeek等,高频才告警)',slack_whitelist_domains:'摸鱼豁免白名单(公司业务需要的娱乐站,不算摸鱼)',risk_whitelist_domains:'风险豁免白名单(公司采购的正规网盘/邮箱等,不进风险识别)',slack_sdk_domains:'心跳/埋点排除域名(客户端挂后台的规律上报,不算摸鱼·AI扫描建议维护)'};

          <Form.Item label="接口地址" name="base_url"><Input placeholder="http://10.4.128.18:4000/v1"/></Form.Item>

          <Form.Item label={'Qwen 模型（Key: '+((cfg.qwen||{}).key_masked||'无')+'）'} name="qwen_model"><Input placeholder="Qwen3-32B"/></Form.Item>
          <Form.Item label="Qwen 密钥（留空不改）" name="qwen_key"><Input.Password placeholder="sk-..."/></Form.Item>
          <Form.Item label={'DeepSeek 模型（Key: '+((cfg.deepseek||{}).key_masked||'无')+'）'} name="deepseek_model"><Input placeholder="deepseek"/></Form.Item>
          <Form.Item label="DeepSeek 接口地址" name="deepseek_base_url"><Input placeholder="http://10.0.20.249:4000/v1"/></Form.Item>
          <Form.Item label="DeepSeek 密钥（留空不改）" name="deepseek_key"><Input.Password placeholder="sk-..."/></Form.Item>
          <Form.Item label="问答专用模型" name="ask_model" extra="AI问答用的模型(要快,建议留空=Qwen)"><Input placeholder="留空=Qwen"/></Form.Item>
          <Form.Item label="深度任务模型" name="smart_model" extra="摸鱼总结/规则扫描/告警复核用的深度模型(本地部署的思考型,如 DeepSeek-R1);留空=Qwen。外部模型勿填(数据不出内网)"><Input placeholder="DeepSeek-R1"/></Form.Item>
          <Button type="primary" htmlType="submit" loading={saving}>保存</Button>
        </Form>
      </Card>},
      {key:'syslog', label:'Syslog接收', children:<Card className="card" title="Syslog 实时接收" size="small">

        <div style={{marginBottom:8}}>
          <Typography.Text style={{fontSize:12}}>告警推送地址（留空不推）</Typography.Text>
          <Input placeholder="https://oapi.dingtalk.com/robot/send?access_token=..." defaultValue={cfg.notify_webhook||''} onChange={debounce(e=>PUTJ('/api/config',{notify_webhook:e.target.value}), 800)} />

          ]}/> : <Typography.Text type="secondary" style={{fontSize:12}}>暂无豁免。在"告警管理"标记误报时会自动创建（被豁免的用户同类行为不再告警）。</Typography.Text>}
        <Alert type="info" showIcon style={{marginTop:8}} message="删除豁免后，该用户对应场景的行为会恢复告警。"/>
      </Card>},
      {key:'dict', label:'字典&AI规则', children:<>
        <Card className="card" title="AI 规则建议（扫未分类高频域名→AI 分类）" size="small" style={{marginBottom:16}}

          onCancel={()=>setSugModal(null)} onOk={()=>{}}

          {sugModal && <>

              <b>AI 理由:</b> {sugModal.reason}<br/>
              <span style={{color:'var(--ink3)'}}>AI 不确定归类,请人工判断这个域名属于哪类风险,纳入对应监控字典:</span>
            </div>
            <Space wrap>
              {[['netdisk_domains','网盘/云盘'],['personal_email_domains','个人邮箱'],['recruitment_sites','招聘'],['remote_control_domains','远程控制'],['code_repo_domains','代码仓库'],['wechat_file_domains','微信文件助手'],['ai_assistant_domains','AI助手']].map(([k,lbl])=>
                <Button key={k} size="small" onClick={()=>applySug(sugModal,k)}>{lbl}</Button>
              )}
            </Space>
            <div style={{marginTop:10}}><Button size="small" onClick={()=>setSugModal(null)}>取消(不采纳)</Button></div>
          </>}
        </Modal>
        <Card className="card" title="检测字典（可选，默认全自动）" size="small" extra={<Upload showUploadList={false} beforeUpload={uploadLog}><Button size="small" type="primary">导入日志</Button></Upload>}>
          {Object.keys(DM).map(n=><DictEditor key={n} name={n} label={DM[n]} initial={dicts[n]} onSave={saveDict}/>)}
          <Alert type="info" showIcon style={{marginTop:8}} message="检测默认全自动（不依赖这些词）。标为误报的行为会自动豁免，下次同类不再告警。"/>
        </Card>
      </>},
    ]}/>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
