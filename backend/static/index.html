<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>用户行为分析系统</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="https://cdn.bootcdn.net/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link rel="stylesheet" href="https://cdn.bootcdn.net/ajax/libs/animate.css/4.1.1/animate.min.css">
<script src="/libs/react.js"></script>
<script src="/libs/react-dom.js"></script>
<script src="/libs/dayjs.js"></script>
<script src="/libs/antd.js"></script>
<script src="/libs/echarts.js"></script>
<script src="/libs/babel.js"></script>
<style>
  :root{
    --ink:#0f172a; --ink2:#475569; --ink3:#94a3b8; --ink4:#cbd5e1;
    --line:#eef1f6; --bg:#fafbfc;
    --brand:#4f46e5; --brand-soft:#eef2ff; --brand-deep:#4338ca;
    --danger:#ef4444; --danger-soft:#fef2f2;
    --warn:#f59e0b; --ok:#16a34a;
    --shadow-sm:0 1px 2px rgba(15,23,42,.04);
    --shadow-md:0 1px 3px rgba(15,23,42,.05), 0 4px 12px rgba(15,23,42,.04);
    --shadow-lg:0 4px 6px rgba(15,23,42,.03), 0 10px 30px rgba(15,23,42,.07);
    --radius:12px;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","HarmonyOS Sans","Microsoft YaHei",sans-serif;-webkit-font-smoothing:antialiased;}
  #root{min-height:100vh;}
  .logo{height:60px;display:flex;align-items:center;justify-content:center;text-align:center;color:var(--brand);font-size:15px;font-weight:700;line-height:1.3;border-bottom:1px solid var(--line);background:#fff;letter-spacing:.5px;}
  .num{font-family:Consolas,"Courier New",monospace;font-variant-numeric:tabular-nums;}
  .tile{background:#fff;border:1px solid var(--line);border-radius:12px;padding:20px 22px;cursor:pointer;transition:.2s;position:relative;overflow:hidden;box-shadow:0 1px 2px rgba(15,23,42,.03);}
  .tile:hover{border-color:var(--brand);box-shadow:0 8px 24px rgba(79,70,229,.15);transform:translateY(-2px);}
  .tile .v{font-size:30px;font-weight:700;color:var(--ink);letter-spacing:-.5px;line-height:1.1;}
  .tile.alert .v{color:var(--danger);}
  .tile.alert{border-top:3px solid var(--danger);}
  .tile .l{color:var(--ink2);font-size:12px;margin-top:7px;letter-spacing:.5px;}
  .tile .arr{position:absolute;right:12px;bottom:10px;color:var(--ink3);font-size:10px;}
  .risk{display:inline-block;padding:2px 9px;border-radius:5px;font-family:Consolas,monospace;font-weight:700;font-size:12px;}
  .legend span{display:inline-block;margin-right:16px;font-size:12px;color:var(--ink2);}
  .swatch{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:middle;}
  .tl{border-left:2px solid var(--brand);margin:8px 0 8px 4px;padding-left:14px;}
  .tl .it{margin:8px 0;font-size:13px;} .tl .t{color:var(--ink3);font-size:12px;}
  .card{border:1px solid var(--line) !important;border-radius:var(--radius) !important;box-shadow:var(--shadow-md) !important;animation:cardIn .4s ease both;}
  @keyframes cardIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .card>.ant-card-head{min-height:40px;border-bottom-color:var(--line) !important;}
  .sec-title{color:var(--ink2);font-size:12px;letter-spacing:1px;margin:6px 0 10px;}
  .st-tag{display:inline-block;padding:1px 7px;border-radius:4px;font-size:11px;font-weight:600;}
  .ant-statistic-content-value{color:var(--ink);}
  .ant-statistic-title{color:var(--ink2) !important;}
  .ant-table-small>.ant-table-content .ant-table-tbody>tr>td,.ant-table-small>.ant-table-content .ant-table-thead>tr>th{padding:9px 8px;}
  .row-crit{box-shadow:inset 3px 0 0 var(--danger);background:var(--danger-soft);}
  .row-high{box-shadow:inset 3px 0 0 var(--warn);}
  .row-mid{box-shadow:inset 3px 0 0 #fbbf24;background:#fffdf5;}
  .sec-fade{color:var(--ink3);}
  .flowbar{display:flex;align-items:center;background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px 8px;margin-bottom:16px;box-shadow:0 1px 3px rgba(15,23,42,.04);}
  .flow-item{flex:1;min-width:84px;text-align:center;padding:0 4px;}
  .flow-item .fv{font-size:24px;font-weight:700;color:var(--ink);letter-spacing:-.5px;line-height:1.1;}
  .flow-item .fl{font-size:11px;color:var(--ink3);margin-top:5px;letter-spacing:.5px;}
  .flow-arrow{color:var(--ink3);opacity:.4;font-size:16px;}
  .flow-tail{margin-left:auto;padding-left:16px;border-left:1px solid var(--line);font-size:12px;color:var(--ink3);white-space:nowrap;}
  .card{transition:box-shadow .2s !important;}
  .card:hover{box-shadow:var(--shadow-lg) !important;}
  .ant-table-tbody>tr{transition:background .15s;}
  .ant-table-tbody>tr:hover>td{background:#f8fafc !important;}
  .logo{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;line-height:1.3;}
  .logo .ic{font-size:24px;line-height:1;filter:grayscale(.1);}
  .flow-item{transition:.2s;}
  .flow-item:hover .fv{color:var(--brand);}
  .brand-bar{width:4px;height:22px;background:var(--brand);border-radius:2px;}
</style>
</head>
<body>
<div id="root"><div style="padding:40px;text-align:center;color:#9aa3b2">加载中（本地库，约1~2秒）…</div></div>
<script>window.onerror=function(m,s,l,c,e){var d=document.getElementById('root');if(d)d.innerHTML='<div style="padding:30px;color:#c0392b;font-family:monospace;white-space:pre-wrap">前端出错：'+(e&&e.stack||m)+'\n\n请截图发我。</div>';return false;};</script>
<script type="text/babel">
const { Layout, Menu, Card, Row, Col, Table, Tag, Button, Input, Form, message, Select, Modal,
        Space, Upload, Divider, Typography, Badge, Empty, Descriptions, Alert, Radio, ConfigProvider, Statistic, Tooltip, Progress, Tabs } = antd;
const { Sider, Header, Content } = Layout;
const { useState, useEffect, useRef } = React;

const LVL = s => (s==null)?{c:'#9aa3b2',l:'-'} : s>=86?{c:'#ff4d4f',l:'严重'} : s>=61?{c:'#fa8c16',l:'高危'} : s>=31?{c:'#faad14',l:'关注'} : {c:'#52c41a',l:'正常'};
const INTENT = {data_exfiltration:'数据外发', job_seeking:'求职离职', baseline_deviation:'行为偏离', policy_violation:'违规', normal_work:'正常', unknown:'未知'};
const DEV = {none:'无', minor:'轻微', major:'重大', severe:'严重', unknown:'未知'};
const STATUS_MAP = {NEW:{c:'#4f46e5',t:'待处理'}, TRIAGING:{c:'#faad14',t:'处理中'}, CONFIRMED:{c:'#ff4d4f',t:'已确认'}, FP:{c:'#bfbfbf',t:'误报'}, CLOSED:{c:'#52c41a',t:'已关闭'}};
// 防抖回调（延迟ms后执行，取消前序）
function debounce(fn, delay){ let t; return (...args) => { clearTimeout(t); t = setTimeout(()=>fn(...args), delay); }; }
const STATUS_OPTS = [{label:'待处理',value:'NEW'},{label:'处理中',value:'TRIAGING'},{label:'已确认',value:'CONFIRMED'},{label:'误报',value:'FP'},{label:'已关闭',value:'CLOSED'}];
const fmt = s => (s||'').replace('T',' ').slice(0,16);
const GET = u=>fetch(u).then(r=>r.ok?r.json():r.text().then(t=>Promise.reject(new Error('HTTP '+r.status)))).catch(e=>{console.error('GET '+u,e);return {};});
const GETL = u=>fetch(u).then(r=>r.ok?r.json():r.text().then(t=>Promise.reject(new Error('HTTP '+r.status)))).then(d=>Array.isArray(d)?d:[]).catch(e=>{console.error('GETL '+u,e);return [];});
const POST=(u,o)=>fetch(u,{method:'POST',...o}).then(r=>r.ok?r.json():r.text().then(t=>Promise.reject(new Error('HTTP '+r.status)))).catch(e=>{console.error('POST '+u,e);message.error('请求失败');return {};});
const PUTJ=(u,b)=>fetch(u,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)}).then(r=>r.ok?r.json():r.text().then(t=>Promise.reject(new Error('HTTP '+r.status)))).catch(e=>{console.error('PUT '+u,e);message.error('保存失败');return {};});
const DEL=(u)=>fetch(u,{method:'DELETE'}).then(r=>r.ok?r.json():r.text().then(t=>Promise.reject(new Error('HTTP '+r.status)))).catch(e=>{console.error('DEL '+u,e);message.error('删除失败');return {};});

function RiskBadge({s}){ const v=LVL(s); return <span className="risk" style={{background:v.c+'1a',color:v.c,border:'1px solid '+v.c+'66'}}>{s==null?'-':s} {v.l}</span>; }
function StatusTag({s}){ const v=STATUS_MAP[s]||{c:'#999',t:s}; return <span className="st-tag" style={{background:v.c+'1a',color:v.c}}>{v.t}</span>; }
function Legend(){ return <div className="legend">
  <span><i className="swatch" style={{background:'#52c41a'}}/>0-30 正常</span>
  <span><i className="swatch" style={{background:'#faad14'}}/>31-60 关注</span>
  <span><i className="swatch" style={{background:'#fa8c16'}}/>61-85 高危</span>
  <span><i className="swatch" style={{background:'#ff4d4f'}}/>86-100 严重</span>
</div>; }

const FROM_TITLE={computers:'用户视图',alerts:'告警管理',efficiency:'效率监控',dashboard:'监控大屏'};
function ProfilePage({user, goBack, from}){
  const [data,setData]=useState(null);
  const trendRef=useRef(), hoursRef=useRef(), actRef=useRef();
  useEffect(()=>{ if(user) GET('/api/employees/'+encodeURIComponent(user)).then(setData); },[user]);
  useEffect(()=>{
    if(!data) return;
    const vs=data.verdicts||[];
    if(vs.length&&trendRef.current){ const c=echarts.init(trendRef.current);
      const riskColors=vs.map(v=>v.risk_score>=86?'#ff4d4f':v.risk_score>=61?'#fa8c16':v.risk_score>=31?'#faad14':'#52c41a');
      c.setOption({tooltip:{trigger:'axis',formatter:p=>p[0].name+'<br/>风险分: <b>'+p[0].value+'</b>'},grid:{left:40,right:20,top:20,bottom:35},
        xAxis:{type:'category',data:vs.map(v=>(v.window_start||'').replace('T',' ').slice(5,16)),axisLabel:{color:'#9aa3b2',fontSize:9,rotate:30}},
        yAxis:{type:'value',max:100,axisLabel:{color:'#9aa3b2'}},
        series:[{type:'line',data:vs.map(v=>v.risk_score||0),smooth:true,areaStyle:{color:'#4f46e522'},lineStyle:{color:'#4f46e5'},itemStyle:{color:function(p){return riskColors[p.dataIndex]||'#4f46e5';}}}]});}
    const hrs=(data.profile||{}).active_hours_top||[];
    if(hrs.length&&hoursRef.current){ const c=echarts.init(hoursRef.current);
      const full=Array.from({length:24},(_,h)=>hrs.includes(h)?1:0);
      c.setOption({tooltip:{},grid:{left:30,right:15,top:15,bottom:30},
        xAxis:{type:'category',data:Array.from({length:24},(_,h)=>h+'时'),axisLabel:{color:'#9aa3b2',fontSize:9}},
        yAxis:{type:'value',show:false},
        series:[{type:'bar',data:full,itemStyle:{color:full.map(v=>v?'#4f46e5':'#e6ecf5')}}]});}
    const evs=data.events||[];
    if(evs.length&&actRef.current){ const c=echarts.init(actRef.current);
      const actCnt={}; evs.forEach(e=>{ const a=e.action||'UNKNOWN'; actCnt[a]=(actCnt[a]||0)+1; });
      const top=Object.entries(actCnt).sort((a,b)=>b[1]-a[1]).slice(0,8);
      c.setOption({tooltip:{},grid:{left:80,right:20,top:15,bottom:30},
        xAxis:{type:'value',axisLabel:{color:'#9aa3b2'}},
        yAxis:{type:'category',data:top.map(t=>t[0]).reverse(),axisLabel:{color:'#6b7280',fontSize:11}},
        series:[{type:'bar',data:top.map(t=>t[1]).reverse(),itemStyle:{color:'#4f46e5',borderRadius:[0,4,4,0]}}]});}
  },[data]);
  if(!data) return <Card className="card"><div style={{padding:40,textAlign:'center',color:'#9aa3b2'}}>加载中...</div></Card>;
  const vs=data.verdicts||[];
  const evs=data.events||[];
  const maxRisk=vs.length?Math.max(...vs.map(v=>v.risk_score||0)):0;
  const p=data.profile||{};
  const domains=p.common_domains||[];
  const sangforCnt=evs.filter(e=>e.source==='sangfor').length;
  const ipguardCnt=evs.filter(e=>e.source==='ipguard').length;
  const docCnt=evs.filter(e=>e.category==='DOC').length;
  const webCnt=evs.filter(e=>e.category==='WEB').length;
  const searchCnt=evs.filter(e=>e.category==='SEARCH').length;
  const usbUsed=(p.channels_used||[]).includes('USB');
  const netdiskUsed=(p.channels_used||[]).some(c=>c==='NETWORK');
  return (<div>
    <Row gutter={16}>
      <Col span={5}><Card className="card"><Statistic title="历史事件" value={p.sample_count||evs.length}/></Card></Col>
      <Col span={5}><Card className="card"><Statistic title="研判次数" value={vs.length}/></Card></Col>
      <Col span={5}><Card className="card"><Statistic title="最高风险" value={maxRisk} valueStyle={{color:LVL(maxRisk).c}}/></Card></Col>
      <Col span={5}><Card className="card"><Statistic title="观察天数" value={p.active_days||new Set(evs.map(e=>(e.occurred_at||'').slice(0,10))).size}/></Card></Col>
      <Col span={4}><Card className="card"><Statistic title="常用通道" value={(p.channels_used||[]).map(c=>({USB:'U盘',NETWORK:'网络/共享',LOCAL:'本地'}[c]||c)).join(' / ')||'-'}/></Card></Col>
    </Row>
    <Row gutter={16} style={{marginTop:16}}>
      <Col span={14}><Card className="card" title="风险趋势（点颜色=风险等级）" size="small"><div ref={trendRef} style={{height:220}}></div></Card></Col>
      <Col span={10}><Card className="card" title="活跃时段" size="small"><div ref={hoursRef} style={{height:220}}></div></Card></Col>
    </Row>
    <Row gutter={16} style={{marginTop:16}}>
      <Col span={8}>
    <Card className="card" title="事件分类" size="small">
      <Table size="small" pagination={false} dataSource={[
        {key:'doc',label:'文档操作',val:docCnt,color:'#4f46e5'},
        {key:'web',label:'网页浏览',val:webCnt,color:'#52c41a'},
        {key:'search',label:'关键字搜索',val:searchCnt,color:'#faad14'},
      ]} columns={[
        {title:'类型',dataIndex:'label'},
        {title:'数量',dataIndex:'val',render:(v,r)=><span style={{fontWeight:600,color:r.color}}>{v}</span>},
        {title:'占比',render:(_,r)=>evs.length?<span style={{color:'#9aa3b2'}}>{Math.round(r.val/evs.length*100)}%</span>:'-'},
      ]}/>
      <div style={{marginTop:12}}>
        <Typography.Text type="secondary" style={{fontSize:12}}>操作类型 Top8：</Typography.Text>
        <div ref={actRef} style={{height:160,marginTop:4}}></div>
      </div>
    </Card>
      </Col>
      <Col span={8}>
    <Card className="card" title="数据来源" size="small">
      <Table size="small" pagination={false} dataSource={[
        {key:'sangfor',label:'深信服上网行为',val:sangforCnt,color:'#52c41a'},
        {key:'ipguard',label:'IP-Guard文档/网页',val:ipguardCnt,color:'#4f46e5'},
      ]} columns={[
        {title:'来源',dataIndex:'label'},
        {title:'数量',dataIndex:'val',render:(v,r)=><span style={{fontWeight:600,color:r.color}}>{v}</span>},
        {title:'占比',render:(_,r)=>evs.length?<span style={{color:'#9aa3b2'}}>{Math.round(r.val/evs.length*100)}%</span>:'-'},
      ]}/>
      <div style={{marginTop:12,padding:8,background:'#f6f8fb',borderRadius:6}}>
        <Typography.Text type="secondary" style={{fontSize:12}}>外发通道：</Typography.Text>
        <div style={{marginTop:6}}>
          {usbUsed&&<Tag color="red" style={{marginBottom:4}}>USB/移动存储</Tag>}
          {netdiskUsed&&<Tag color="orange" style={{marginBottom:4}}>网络/共享磁盘</Tag>}
          {!usbUsed&&!netdiskUsed&&<Typography.Text type="secondary" style={{fontSize:12}}>无外发通道记录</Typography.Text>}
        </div>
      </div>
    </Card>
      </Col>
      <Col span={8}>
    <Card className="card" title="AI基线摘要" size="small">
      <Typography.Paragraph style={{fontSize:12,marginBottom:0}}>
        <Typography.Text code style={{fontSize:11}}>{data.profile_summary||'（样本不足，按通用可疑度判断）'}</Typography.Text>
      </Typography.Paragraph>
      <Divider style={{margin:'10px 0'}}/>
      <Descriptions column={1} size="small">
        <Descriptions.Item label="日均活动">{p.daily_doc_op_median||0}（峰值{p.daily_doc_op_max||0}）</Descriptions.Item>
        <Descriptions.Item label="行为类型">{(p.actions_seen||[]).join(', ')||'-'}</Descriptions.Item>
        <Descriptions.Item label="常接触词">{p.usual_keywords?(p.usual_keywords.slice(0,5).join(', ')):'-'}</Descriptions.Item>
      </Descriptions>
    </Card>
      </Col>
    </Row>
    <Card className="card" title="研判历史" size="small" style={{marginTop:16}}>
      <Table size="small" rowKey="window_start" pagination={{pageSize:8}} dataSource={vs}
        columns={[{title:'时间',dataIndex:'window_start',width:150,render:v=>(v||'').replace('T',' ').slice(0,16)},
          {title:'意图',dataIndex:'intent',width:120,render:v=><Tag color="blue">{INTENT[v]||v}</Tag>},
          {title:'风险',dataIndex:'risk_score',width:120,render:v=><RiskBadge s={v}/>},
          {title:'说明',dataIndex:'explanation',ellipsis:true}]}/>
    </Card>
    <Card className="card" title={"风险行为（"+(data.risk_events||[]).length+"）"} size="small" style={{marginTop:16}}>
      <div className="tl" style={{maxHeight:350,overflow:'auto'}}>
        {(data.risk_events||[]).map((e,i)=><div className="it" key={i}>
          <span className="t">{fmt(e.occurred_at)}</span>
          {e.risk_class&&<Tag color="orange" style={{marginLeft:4,fontSize:10}}>{e.risk_class}</Tag>}
          <b> [{e.action}]</b> {e.domain||e.target_value}
          <Tag style={{marginLeft:6,fontSize:10}} color={e.source==='sangfor'?'green':'blue'}>{e.source==='sangfor'?'深信服':'IP-Guard'}</Tag>
        </div>)}
        {!(data.risk_events||[]).length&&<div style={{color:'#9aa3b2',padding:24,textAlign:'center'}}>近期无风险行为</div>}
      </div>
    </Card>
    <Card className="card" title={"摸鱼会话（"+(data.slack_sessions||[]).length+"段）"} size="small" style={{marginTop:16}}>
      <div className="tl" style={{maxHeight:300,overflow:'auto'}}>
        {(data.slack_sessions||[]).map((e,i)=><div className="it" key={i}>
          <span className="t">{(e.start||'').replace('T',' ').slice(5,16)} → {(e.end||'').slice(11,16)}</span>
          <Tag color={e.duration>=60?'red':'orange'} style={{marginLeft:4,fontSize:10}}>{e.duration>=60?Math.floor(e.duration/60)+'h'+e.duration%60+'m':e.duration>0?e.duration+'分':'单次'}</Tag>
          <Tag color="purple" style={{fontSize:10}}>{e.cat}</Tag>
          <b> {(e.domains||[]).join(' / ')}</b>
          {e.count>1&&<span style={{color:'#94a3b8',fontSize:11}}> ({e.count}次访问)</span>}
        </div>)}
        {!(data.slack_sessions||[]).length&&<div style={{color:'#9aa3b2',padding:24,textAlign:'center'}}>近期无摸鱼行为</div>}
      </div>
    </Card>
    {domains.length>0&&<Card className="card" title="常访问域名（按频率）" size="small" style={{marginTop:16}}>
      <Space wrap size={[4,4]}>
        {domains.slice(0,40).map((d,i)=><Tag key={d} style={{fontSize:11}} color={i<5?'blue':'default'}>{d}</Tag>)}
      </Space>
    </Card>}
  </div>);
}

function App(){
  const [key,setKey]=useState('dashboard'); const [profileUser,setProfileUser]=useState(null); const [profileFrom,setProfileFrom]=useState('alerts');
  const [now,setNow]=useState('');
  useEffect(()=>{ const f=()=>setNow(new Date().toLocaleString('zh-CN',{hour12:false})); f(); const t=setInterval(f,1000); return ()=>clearInterval(t); },[]);
  const pollDetect=()=>{
    const tick=()=>fetch('/api/detect/status').then(r=>r.json()).then(s=>{
      if(s.running){
        const pct = s.total ? Math.round(s.done/s.total*100) : 0;
        message.loading({content:'研判中 '+s.done+'/'+s.total+' ('+pct+'%)',key:'det',duration:0});
        setTimeout(tick,3000);
      } else {
        message.success({content:'研判完成：'+s.judged+' 窗口，告警 '+s.alerts,key:'det',duration:3});
        setTimeout(()=>location.reload(),1000);
      }
    });
    tick();
  };
  // 页面加载时自动检测是否有正在运行的研判
  useEffect(()=>{ fetch('/api/detect/status').then(r=>r.json()).then(s=>{ if(s.running&&s.total>0) pollDetect(); }); },[]);
  const uploadLog=f=>{ const fd=new FormData(); fd.append('file',f);
    message.loading({content:'导入中…',key:'up',duration:0});
    fetch('/api/ingest',{method:'POST',body:fd}).then(r=>r.json()).then(r=>{ message.success({content:'已导入 '+r.imported+' 条，开始研判…',key:'up',duration:2}); pollDetect(); }); return false; };
  return (
    <ConfigProvider theme={{token:{colorPrimary:'#4f46e5',borderRadius:8}}}>
    <Layout style={{minHeight:'100vh'}}>
      <Sider width={200} style={{background:'#fff',borderRight:'1px solid #e8eef7'}}>
        <div className="logo"><span className="ic"><i className="fa-solid fa-chart-line"></i></span>用户行为分析系统</div>

function Computers({goProfile}){
  const [rows,setRows]=useState([]); const [uq,setUq]=useState(''); const [riskFilter,setRiskFilter]=useState('all');
  const [lastUpd,setLastUpd]=useState(null); const [loading,setLoading]=useState(true); const [excs,setExcs]=useState([]);
  const load=async()=>{const [r,ex]=await Promise.all([GETL('/api/computers'),GET('/api/exceptions')]);setRows(r);setExcs(Array.isArray(ex)?ex:((ex&&ex.items)||[]));setLastUpd(new Date());setLoading(false);};
  useEffect(()=>{ load(); const t=setInterval(load,15000); return ()=>clearInterval(t); },[]);
  const summary={
    total: rows.length,
    alert: rows.filter(r=>(r.alert_count||0)>0).length,
    high: rows.filter(r=>(r.max_risk||0)>=61).length,
    clean: rows.filter(r=>(r.alert_count||0)===0).length,
  };
  const exMap={}; excs.forEach(e=>{const k=e.employee; if(k){(exMap[k]=exMap[k]||[]).push(INTENT[e.signal_type]||e.signal_type);}});
  const filtered=rows.filter(r=>{
    if(uq&&!(r.computer||'').toLowerCase().includes(uq.toLowerCase()))return false;
    if(riskFilter==='alert'&&!(r.alert_count>0))return false;
    if(riskFilter==='high'&&(r.max_risk||0)<61)return false;
    if(riskFilter==='clean'&&(r.alert_count>0))return false;
    return true;
  });
  return (<div>
    <Row gutter={20} style={{marginBottom:16}}>
      <Col span={6}><Card className="card" size="small" style={{padding:'10px 14px'}}><Statistic title="总用户" value={summary.total} valueStyle={{fontSize:18}}/></Card></Col>
      <Col span={6}><Card className="card" size="small" style={{padding:'10px 14px'}}><Statistic title="有告警" value={summary.alert} valueStyle={{fontSize:18}}/></Card></Col>
      <Col span={6}><Card className="card" size="small" style={{padding:'10px 14px'}}><Statistic title="高危(61+)" value={summary.high} valueStyle={{fontSize:18,color:'#ef4444'}}/></Card></Col>
      <Col span={6}><Card className="card" size="small" style={{padding:'10px 14px'}}><Statistic title="无告警" value={summary.clean} valueStyle={{fontSize:18}}/></Card></Col>
    </Row>
    <Card className="card" size="small">
      <Space style={{marginBottom:8}}>
        <Input.Search placeholder="搜索用户名" allowClear style={{width:180}} onChange={e=>setUq(e.target.value)} />
        <Select defaultValue="all" style={{width:110}} onChange={setRiskFilter}>
          <Select.Option value="all">全部</Select.Option>
          <Select.Option value="alert">有告警</Select.Option>
          <Select.Option value="high">高危61+</Select.Option>
          <Select.Option value="clean">无告警</Select.Option>
        </Select>
        <span style={{fontSize:11,color:'#9aa3b2'}}>每15秒自动刷新 {lastUpd&&'· '+lastUpd.toLocaleTimeString()}</span>
      </Space>
      <Table size="small" rowKey="computer" pagination={{pageSize:14}} loading={loading}
        dataSource={filtered}
        rowClassName={r=>{
          const risk=(r.max_risk||0);
          if(risk>=86)return 'row-crit';
          if(risk>=61)return 'row-high';
          if((r.alert_count||0)>0)return 'row-mid';
          return '';
        }}
        onRow={r=>({onClick:()=>goProfile(r.computer),style:{cursor:'pointer'}})}
        columns={[
          {title:'用户',dataIndex:'computer',width:150,
            render:(v,r)=>{
              const rk=r.max_risk||0; const ex=exMap[v];
              return (<span><a style={{fontWeight:rk>=61?700:400,color:rk>=86?'#ff4d4f':rk>=61?'#fa8c16':rk>=31?'#faad14':'inherit'}}>{v}</a>{ex&&<Tooltip title={'已豁免：'+ex.join('、')}><Tag color="default" style={{marginLeft:4,fontSize:10,lineHeight:'16px'}}>已豁免</Tag></Tooltip>}</span>);
            }},
          {title:'风险',dataIndex:'max_risk',width:90,render:v=><RiskBadge s={v}/>},
          {title:'告警',dataIndex:'alert_count',width:60,
            render:v=>v>0?<Tag color="red" style={{cursor:'pointer'}}>{v}条</Tag>:<span style={{color:'#d9d9d9'}}>—</span>},
          {title:'事件',dataIndex:'event_count',width:70,render:v=><span className="num" style={{color:'#6b7280'}}>{v}</span>},
          {title:'最近活动',dataIndex:'last_seen',width:130,render:fmt},
          {title:'',width:50,render:()=><span style={{color:'#bcc6d6',fontSize:11}}>▸</span>}
        ]}/>
    </Card>
  </div>);
}

          if(lvl==='crit'&&v.risk_score<86)return false;
          if(lvl==='high'&&(v.risk_score<61||v.risk_score>85))return false;
          if(lvl==='mid'&&(v.risk_score<31||v.risk_score>60))return false;
          if(scenario!=='all'&&v.scenario!==scenario)return false;
          return true;
        });
        const ag={};
        filtered.forEach(v=>{
          if(!ag[v.employee])ag[v.employee]={key:v.employee,employee:v.employee,scenarios:[],maxRisk:0,count:0,latest:v.window_start,summary:'',verdict_id:v.verdict_id,intent:v.scenario};
          const g=ag[v.employee];
          const sc=INTENT[v.scenario]||v.scenario;
          if(!g.scenarios.find(s=>s.label===sc))g.scenarios.push({label:sc,risk:v.risk_score});
          if((v.risk_score||0)>g.maxRisk){g.maxRisk=v.risk_score;g.summary=v.summary;g.verdict_id=v.verdict_id;g.intent=v.scenario;}
          g.count++; if(v.window_start>g.latest)g.latest=v.window_start;
        });
        return Object.values(ag).sort((a,b)=>b.maxRisk-a.maxRisk);
      })()}
        columns={[
          {title:'用户',dataIndex:'employee',width:100,render:v=><a onClick={(e)=>{e.stopPropagation();goProfile(v);}} style={{cursor:'pointer'}}>{v}</a>},
          {title:'风险场景',dataIndex:'scenarios',render:v=><Space wrap size={[4,4]}>{v.map(s=><Tag key={s.label} style={{fontSize:11}} color={s.risk>=86?'red':s.risk>=61?'orange':s.risk>=31?'gold':'blue'}>{s.label} {s.risk}</Tag>)}</Space>},
          {title:'次数',dataIndex:'count',width:50,render:v=><span className="num">{v}</span>},
          {title:'最近告警',dataIndex:'latest',width:135,render:v=><span style={{fontSize:11,color:'#6b7280'}}>{(v||'').replace('T',' ').slice(0,16)}</span>},
          {title:'风险',dataIndex:'maxRisk',width:90,render:v=><RiskBadge s={v}/>},
          {title:'说明',dataIndex:'summary',render:v=><Tooltip title={v}><span style={{display:'inline-block',maxWidth:300,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap',verticalAlign:'bottom'}}>{v}</span></Tooltip>},
          {title:'操作',width:120,render:(_,r)=>(<Space size={4}>

            <Button size="small" danger ghost onClick={(e)=>doFP(e,r)}>误报</Button>

    </Card>
    <Modal open={fpModal.open} title={'确认误报 — '+fpModal.emp} okText="确认误报" cancelText="取消" okType="danger"
      onCancel={()=>setFpModal({...fpModal,open:false})} onOk={submitFP}>
      <div style={{marginBottom:12}}>

function Ask(){

    if(!q.trim()||sending)return;
    const question=q.trim(); setQ('');
    setMsgs(m=>[...m,{role:'user',text:question}]);

    const r=await POST('/api/ask',{headers:{'Content-Type':'application/json'},body:JSON.stringify({question})});
    setSending(false);
    setMsgs(m=>[...m,{role:'ai',text:(r&&r.answer)||'（无回答）'}]);

          <div style={{maxWidth:'72%',padding:'9px 13px',borderRadius:12,background:m.role==='user'?'#4f46e5':'#f1f5f9',color:m.role==='user'?'#fff':'#0f172a',whiteSpace:'pre-wrap',wordBreak:'break-word',lineHeight:1.6,boxShadow:'0 1px 2px rgba(15,23,42,.04)'}}>{m.text}</div>
        </div>)}

    </div>
    <div style={{marginTop:10,display:'flex',gap:8,alignItems:'flex-end'}}>
      <Input.TextArea value={q} onChange={e=>setQ(e.target.value)} onPressEnter={e=>{if(!e.shiftKey){e.preventDefault();send();}}} placeholder="提问…（回车发送，Shift+回车换行）" autoSize={{minRows:1,maxRows:4}} disabled={sending} style={{flex:1}}/>

          <Form.Item label="DeepSeek 接口地址" name="deepseek_base_url"><Input placeholder="http://10.0.20.249:4000/v1"/></Form.Item>
          <Form.Item label="DeepSeek 密钥（留空不改）" name="deepseek_key"><Input.Password placeholder="sk-..."/></Form.Item>
          <Button type="primary" htmlType="submit" loading={saving}>保存</Button>
        </Form>
      </Card>},
      {key:'syslog', label:'Syslog接收', children:<Card className="card" title="Syslog 实时接收" size="small">
        <div style={{marginBottom:8,color:'#6b7280',fontSize:13}}>监听地址：<b>{cfg.syslog_host||'0.0.0.0'}:{cfg.syslog_port||'8514'}</b></div>
        <div style={{marginBottom:8}}>
          <Typography.Text style={{fontSize:12}}>告警推送地址（留空不推）</Typography.Text>
          <Input placeholder="https://oapi.dingtalk.com/robot/send?access_token=..." defaultValue={cfg.notify_webhook||''} onChange={debounce(e=>PUTJ('/api/config',{notify_webhook:e.target.value}), 800)} />
        </div>
        <div style={{marginBottom:8}}><Badge status={syslog.enabled?'success':'default'} text={syslog.enabled?'监听中（已收 '+syslog.count+' 条，入库 '+syslog.ingested+' 条）':'未启用'}/>
          <Button size="small" type="primary" ghost={syslog.enabled} danger={syslog.enabled} onClick={()=>toggleSys(!syslog.enabled)} style={{marginLeft:8}}>{syslog.enabled?'停止':'启动'}</Button></div>
        {syslog.recent&&syslog.recent.length? <div style={{background:'#f6f8fb',padding:8,fontSize:12,maxHeight:110,overflow:'auto',border:'1px solid #e6ecf5',borderRadius:6}}>
          {syslog.recent.map((m,i)=><div key={i} style={{whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis'}}><b>{m.t}</b> {m.from}: {m.msg.slice(0,80)}</div>)}</div>
          :<Typography.Text type="secondary" style={{fontSize:12}}>等待深信服推送（配好后自动接收→解析→研判）</Typography.Text>}
      </Card>},
      {key:'exempt', label:'豁免管理', children:<Card className="card" title={"误报复核 / 豁免管理（"+excs.length+"）"} size="small">
        {excs.length ? <Table size="small" rowKey="id" pagination={{pageSize:12}} dataSource={excs}
          columns={[
            {title:'用户',dataIndex:'employee',width:90},
            {title:'豁免场景',dataIndex:'signal_type',width:110,render:v=><Tag color="blue">{INTENT[v]||v}</Tag>},
            {title:'原因',dataIndex:'reason',ellipsis:true},
            {title:'有效期',dataIndex:'expires_at',width:110,render:v=>v?v.replace('T',' ').slice(0,10):'永久'},
            {title:'',width:70,render:(_,r)=><Button size="small" danger ghost onClick={()=>delExc(r.id)}>删除</Button>},
          ]}/> : <Typography.Text type="secondary" style={{fontSize:12}}>暂无豁免。在"告警管理"标记误报时会自动创建（被豁免的用户同类行为不再告警）。</Typography.Text>}
        <Alert type="info" showIcon style={{marginTop:8}} message="删除豁免后，该用户对应场景的行为会恢复告警。"/>
      </Card>},
      {key:'dict', label:'字典&AI规则', children:<>
        <Card className="card" title="AI 规则建议（扫未分类高频域名→AI 分类）" size="small" style={{marginBottom:16}}
          extra={<Button size="small" type="primary" loading={loadingSug} onClick={loadSugs}>{sugs?'重新扫描':'开始扫描'}</Button>}>
          {sugs===null ? <Typography.Text type="secondary" style={{fontSize:12}}>点击"开始扫描"，AI 分析高频未分类域名并建议归类，采纳后写入对应词库。</Typography.Text>:
           sugs.length===0 ? <Typography.Text type="secondary" style={{fontSize:12}}>暂无建议。</Typography.Text>:
           <Table size="small" rowKey="domain" pagination={{pageSize:8}} dataSource={sugs}
             columns={[
               {title:'域名',dataIndex:'domain',render:v=><span className="num" style={{fontSize:12}}>{v}</span>},
               {title:'命中',dataIndex:'hits',width:60,render:v=><span style={{color:'#94a3b8'}}>{v}</span>},
               {title:'AI建议',width:150,render:(_,r)=><Tag color={r.target==='ignore'?'default':r.target==='slack_domains'?'purple':'blue'}>{r.target==='ignore'?'忽略(正常)':(r.target==='slack_domains'?'摸鱼·'+(r.cat||''):{netdisk_domains:'网盘',personal_email_domains:'个人邮箱',recruitment_sites:'招聘'}[r.target]||r.target)}</Tag>},
               {title:'理由',dataIndex:'reason',ellipsis:true,render:v=><span style={{fontSize:12,color:'#6b7280'}}>{v}</span>},
               {title:'',width:70,render:(_,r)=><Button size="small" type="primary" ghost disabled={r.target==='ignore'} onClick={()=>applySug(r)}>采纳</Button>},
             ]}/>}
          <Alert type="info" showIcon style={{marginTop:8}} message="AI 建议仅供参考，采纳后写入词库立即生效（影响后续研判）。不放心可忽略。"/>
        </Card>
        <Card className="card" title="检测字典（可选，默认全自动）" size="small" extra={<Upload showUploadList={false} beforeUpload={uploadLog}><Button size="small" type="primary">导入日志</Button></Upload>}>
          {Object.keys(DM).map(n=><DictEditor key={n} name={n} label={DM[n]} initial={dicts[n]} onSave={saveDict}/>)}
          <Alert type="info" showIcon style={{marginTop:8}} message="检测默认全自动（不依赖这些词）。标为误报的行为会自动豁免，下次同类不再告警。"/>
        </Card>
      </>},
    ]}/>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
